<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#090d15" />
<title>InfoStride · Workspace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ══════════════════════════════════════════════════════════════
     DESIGN TOKENS — shared with Meeting Board, US Timer & US Map
     ══════════════════════════════════════════════════════════════ */
  :root {
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --r-xl: 18px;
    --r-lg: 14px;
    --r-md: 10px;
    --r-pill: 999px;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }

  html[data-theme="dark"] {
    --bg:           #090d15;
    --bg-glow-1:    rgba(99, 102, 241, .13);
    --bg-glow-2:    rgba(20, 184, 166, .07);
    --panel:        #131924;
    --panel-2:      #1a2130;
    --panel-3:      #222b3c;
    --panel-glass:  rgba(19, 25, 36, .82);
    --border:       #27303f;
    --border-soft:  #1e2532;
    --border-strong:#33405a;
    --text:         #e9edf6;
    --text-2:       #c3cbdb;
    --muted:        #939cb2;
    --faint:        #626c82;
    --accent:       #818cf8;
    --accent-2:     #6366f1;
    --accent-soft:  rgba(129, 140, 248, .15);
    --accent-line:  rgba(129, 140, 248, .38);
    --success:      #34d399;
    --success-soft: rgba(52, 211, 153, .14);
    --warn:         #fbbf24;
    --warn-soft:    rgba(251, 191, 36, .14);
    --shadow-sm:    0 1px 2px rgba(0,0,0,.5);
    --shadow:       0 8px 24px -6px rgba(0,0,0,.6);
    --shadow-lg:    0 24px 60px -12px rgba(0,0,0,.75);
    --scroll-thumb: #2d3748;
    /* 3-D logo: mirrors the two-tone wordmark (pale mark + indigo mark) */
    --logo-a:       #e9edf6;
    --logo-b:       #818cf8;
    --danger-soft:  rgba(251, 113, 133, .16);
    --map-pst:      #b07ce8;  --map-mst: #e0a355;  --map-cst: #34b39a;  --map-est: #7c8cf8;
    --fx-teal:      rgba(20, 184, 166, .14);
    --fx-beam:      rgba(255, 255, 255, .11);
    --fx-rule:      rgba(255, 255, 255, .035);
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --bg:           #f1f4fa;
    --bg-glow-1:    rgba(99, 102, 241, .11);
    --bg-glow-2:    rgba(13, 148, 136, .06);
    --panel:        #ffffff;
    --panel-2:      #f5f7fc;
    --panel-3:      #ebeff8;
    --panel-glass:  rgba(255, 255, 255, .84);
    --border:       #dce2ee;
    --border-soft:  #e9edf6;
    --border-strong:#c3ccdf;
    --text:         #111726;
    --text-2:       #33405a;
    --muted:        #5c6579;
    --faint:        #8d97ab;
    --accent:       #4f46e5;
    --accent-2:     #4338ca;
    --accent-soft:  rgba(79, 70, 229, .09);
    --accent-line:  rgba(79, 70, 229, .30);
    --success:      #059669;
    --success-soft: rgba(5, 150, 105, .10);
    --warn:         #b45309;
    --warn-soft:    rgba(180, 83, 9, .10);
    --shadow-sm:    0 1px 2px rgba(24, 39, 75, .06);
    --shadow:       0 8px 24px -8px rgba(24, 39, 75, .14);
    --shadow-lg:    0 24px 60px -14px rgba(24, 39, 75, .22);
    --scroll-thumb: #c9d2e3;
    --logo-a:       #1f2430;
    --logo-b:       #4f46e5;
    --danger-soft:  rgba(225, 29, 72, .10);
    --map-pst:      #a56fe0;  --map-mst: #d99a45;  --map-cst: #23a389;  --map-est: #6b7cf5;
    --fx-teal:      rgba(13, 148, 136, .11);
    --fx-beam:      rgba(79, 70, 229, .10);
    --fx-rule:      rgba(17, 23, 38, .035);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 88% -12%, var(--bg-glow-1), transparent 70%),
      radial-gradient(700px 460px at 4% 6%, var(--bg-glow-2), transparent 70%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    font-size: 14px;
    transition: background-color .3s var(--ease), color .3s var(--ease);
    display: flex;
    flex-direction: column;
  }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ══════════════════════════════════════════════════════════════
     AMBIENT BACKDROP — a faint dot field and slow meridian rings,
     so the open space around the logo reads as designed, not empty.
     ══════════════════════════════════════════════════════════════ */
  .ambient {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; overflow: hidden;
  }
  .ambient-dots {
    position: absolute; inset: -10%;
    background-image: radial-gradient(currentColor 1px, transparent 1px);
    background-size: 30px 30px;
    color: var(--text);
    opacity: .045;
    mask-image: radial-gradient(circle at 50% 42%, #000 12%, transparent 68%);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 12%, transparent 68%);
  }
  .ambient-rings {
    position: absolute; left: 50%; top: 46%;
    width: min(880px, 128vw); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    opacity: .5;
  }
  .ambient-rings svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ring-spin   { animation: ringSpin 68s linear infinite; transform-origin: 50% 50%; }
  .ring-spin-r { animation: ringSpin 96s linear infinite reverse; transform-origin: 50% 50%; }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .ambient-glyph {
    position: absolute;
    color: var(--accent);
    opacity: .07;
    animation: glyphDrift 16s ease-in-out infinite;
  }
  .ambient-glyph.g1 { left: 7%;  top: 26%; width: 54px; animation-delay: -2s; }
  .ambient-glyph.g2 { right: 9%; top: 62%; width: 38px; animation-delay: -7s; }
  .ambient-glyph.g3 { left: 16%; bottom: 12%; width: 28px; animation-delay: -11s; }
  @keyframes glyphDrift {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50%     { transform: translateY(-22px) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring-spin, .ring-spin-r, .ambient-glyph { animation: none !important; }
  }
  @media (max-width: 860px) { .ambient-glyph { display: none; } .ambient-dots { opacity: .03; } }
  ::selection { background: var(--accent-soft); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  *::-webkit-scrollbar { width: 10px; }
  *::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 99px;
    border: 2.5px solid transparent; background-clip: content-box;
  }

  /* ══════════════════════════════════════════════════════════════
     HEADER
     ══════════════════════════════════════════════════════════════ */
  .app-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--panel-glass);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--border);
    isolation: isolate;
  }

  /* ── animated header backdrop ─────────────────────────────────
     A drifting aurora, a light beam that sweeps across, and a
     highlight travelling along the bottom rule.                  */
  .header-fx {
    position: absolute; inset: 0;
    overflow: hidden;              /* clips the layers, not the dropdown */
    pointer-events: none;
    z-index: 0;
  }
  .fx-aurora, .fx-beam, .fx-line, .fx-grid { position: absolute; display: block; }

  .fx-aurora {
    top: -420%; left: -30%; width: 160%; height: 900%;
    background: conic-gradient(from 0deg,
      transparent 0deg, var(--accent-soft) 42deg, transparent 96deg,
      var(--fx-teal) 168deg, transparent 222deg,
      var(--accent-soft) 300deg, transparent 360deg);
    animation: fxAurora 34s linear infinite;
    filter: blur(30px);          /* soften the conic seams into a glow */
    opacity: .8;
  }
  @keyframes fxAurora { to { transform: rotate(360deg); } }

  .fx-grid {
    inset: 0;
    background-image: linear-gradient(90deg, var(--fx-rule) 1px, transparent 1px);
    background-size: 46px 100%;
    opacity: .5;
    animation: fxGrid 12s linear infinite;
  }
  @keyframes fxGrid { to { background-position: 46px 0; } }

  .fx-beam {
    top: 0; bottom: 0; left: 0; width: 24%;
    background: linear-gradient(100deg, transparent, var(--fx-beam) 48%, transparent);
    filter: blur(3px);
    transform: translateX(-160%);
    animation: fxBeam 8.5s var(--ease) infinite;
  }
  @keyframes fxBeam {
    0%        { transform: translateX(-160%); }
    58%, 100% { transform: translateX(520%); }
  }

  .fx-line {
    left: 0; bottom: 0; width: 34%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 8px var(--accent-line);
    animation: fxLine 7s linear infinite;
  }
  @keyframes fxLine {
    0%   { transform: translateX(-100%); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateX(320%); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fx-aurora, .fx-beam, .fx-line, .fx-grid { animation: none !important; }
    .fx-beam { opacity: 0; }
  }

  .header-inner {
    position: relative; z-index: 1;
    max-width: 1240px; margin: 0 auto;
    min-height: 62px;
    padding: 10px clamp(14px, 3vw, 30px);
    display: flex; align-items: center; gap: 14px;
  }

  .header-spacer { flex: 1; }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  /* Theme toggle — same control as the other three pages */
  .theme-toggle {
    position: relative; width: 62px; height: 32px; flex-shrink: 0;
    border-radius: var(--r-pill);
    border: 1px solid var(--border);
    background: var(--panel-2);
    cursor: pointer; padding: 0;
    transition: border-color .25s var(--ease);
  }
  .theme-toggle:hover { border-color: var(--accent-line); }
  .theme-toggle-knob {
    position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 2px 8px -1px var(--accent-line);
    transition: transform .32s cubic-bezier(.34, 1.4, .64, 1);
  }
  html[data-theme="light"] .theme-toggle-knob { transform: translateX(30px); }
  .theme-toggle-icons {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 0 8px;
    color: var(--faint); pointer-events: none;
  }
  html[data-theme="dark"]  .tt-moon { opacity: 0; }
  html[data-theme="light"] .tt-sun  { opacity: 0; }

  /* ── Profile ─────────────────────────────────────────────────── */
  .profile { position: relative; flex-shrink: 0; }
  .profile-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 4px 10px 4px 4px;
    border-radius: var(--r-pill);
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: var(--font-ui); font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all .18s var(--ease);
    max-width: 210px;
  }
  .profile-btn:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    color: #fff; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: -.2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .profile-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-btn svg { color: var(--muted); flex-shrink: 0; }

  .profile-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 130;
    width: 250px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    padding: 6px;
    animation: pop .16s var(--ease);
  }
  .profile-head {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 10px 12px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 6px;
  }
  .profile-head .avatar { width: 38px; height: 38px; font-size: 13px; }
  .ph-body { min-width: 0; }
  .ph-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 9px 10px; border: none; border-radius: var(--r-md);
    background: transparent; color: var(--text-2);
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 600;
    cursor: pointer; text-decoration: none;
    transition: background .15s var(--ease), color .15s var(--ease);
  }
  .menu-item:hover { background: var(--panel-2); color: var(--text); }
  .menu-item svg { color: var(--muted); flex-shrink: 0; }
  .menu-item:hover svg { color: var(--accent); }
  .menu-sep { height: 1px; background: var(--border-soft); margin: 4px 0; }

  /* ══════════════════════════════════════════════════════════════
     MAIN
     ══════════════════════════════════════════════════════════════ */
  main {
    flex: 1;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: clamp(18px, 3vw, 32px) clamp(14px, 3vw, 30px) clamp(16px, 2.4vw, 28px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }

  /* ── Greeting ────────────────────────────────────────────────── */
  .hero { text-align: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-radius: var(--r-pill);
    padding: 5px 13px;
    margin-bottom: 14px;
  }
  .eyebrow .live {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--accent-line); }
    70%  { box-shadow: 0 0 0 7px rgba(129,140,248,0); }
    100% { box-shadow: 0 0 0 0 rgba(129,140,248,0); }
  }

  h1.greeting {
    font-size: clamp(28px, 5.4vw, 50px);
    font-weight: 780;
    letter-spacing: -1.4px;
    line-height: 1.08;
  }
  h1.greeting .who {
    background: linear-gradient(100deg, var(--accent), var(--accent-2) 70%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1.greeting .welcome { color: var(--text-2); font-weight: 600; }

  /* ══════════════════════════════════════════════════════════════
     3-D LOGO STAGE
     ══════════════════════════════════════════════════════════════ */
  .logo-stage {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: clamp(4px, 1.2vw, 14px) auto clamp(2px, .6vw, 6px);
    display: flex; flex-direction: column; align-items: center;
  }
  .logo-glow {
    position: absolute; left: 50%; top: 42%;
    width: min(430px, 82vw); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 62%);
    filter: blur(14px);
    pointer-events: none;
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: .75; transform: translate(-50%,-50%) scale(1); }
    50%     { opacity: 1;   transform: translate(-50%,-50%) scale(1.08); }
  }

  .logo-mount {
    position: relative; z-index: 1;
    width: 100%;
    height: clamp(150px, 20vw, 224px);
    touch-action: none;
  }
  .logo-mount canvas { display: block; width: 100% !important; height: 100% !important; }

  /* Reflection under the mark */
  .logo-floor {
    position: relative; z-index: 0;
    width: min(300px, 66vw); height: 30px;
    margin-top: -22px;
    background: radial-gradient(ellipse 50% 42% at center, var(--accent-line) 0%, transparent 72%);
    filter: blur(15px);
    opacity: .38;
    animation: floorPulse 4.6s ease-in-out infinite;
  }
  @keyframes floorPulse {
    0%,100% { transform: scaleX(1);    opacity: .5; }
    50%     { transform: scaleX(1.12); opacity: .68; }
  }

  .wordmark {
    position: relative; z-index: 1;
    height: clamp(26px, 3.6vw, 36px);
    width: auto; display: block;
    margin-top: clamp(8px, 1.4vw, 14px);
    user-select: none;
  }
  html[data-theme="light"] .wordmark.on-dark  { display: none; }
  html[data-theme="dark"]  .wordmark.on-light { display: none; }


  /* ── CSS-3D fallback (used when WebGL is unavailable) ─────────── */
  .logo-css {
    position: absolute; inset: 0; z-index: 1;
    display: none;
    place-items: center;
    perspective: 900px;
  }
  .logo-css.on { display: grid; }
  .css-scene {
    width: 200px; height: 150px;
    position: relative;
    transform-style: preserve-3d;
    animation: cssSpin 9s linear infinite, cssBob 4.6s ease-in-out infinite;
  }
  .css-chev { position: absolute; inset: 0; transform-style: preserve-3d; }
  .css-layer {
    position: absolute; inset: 0;
    clip-path: polygon(6% 4%, 52% 50%, 6% 96%, 40% 96%, 86% 50%, 40% 4%);
  }
  @keyframes cssSpin { from { transform: rotateY(-26deg); } 50% { transform: rotateY(26deg); } to { transform: rotateY(-26deg); } }
  @keyframes cssBob  { 0%,100% { margin-top: 0; } 50% { margin-top: -14px; } }

  /* ══════════════════════════════════════════════════════════════
     APP LAUNCHER
     ══════════════════════════════════════════════════════════════ */
  .apps-label {
    display: flex; align-items: center; gap: 12px;
    width: 100%; max-width: 1040px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--faint);
    margin: clamp(16px, 2.6vw, 26px) 0 14px;
  }
  .apps-label::before, .apps-label::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }

  .apps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 1.8vw, 20px);
    width: 100%; max-width: 1040px;
  }

  .app-card {
    position: relative;
    display: flex; flex-direction: column;
    gap: 13px;
    padding: 13px 13px 15px;
    border-radius: var(--r-xl);
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: var(--shadow-sm);
    text-decoration: none; color: inherit;
    overflow: hidden;
    isolation: isolate;
    transition: transform .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease);
  }
  /* accent hairline that lights up along the top edge */
  .app-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--tint-fg, var(--accent)), transparent);
    opacity: 0; transition: opacity .3s var(--ease);
  }
  /* soft bloom from behind the artwork */
  .app-card::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(520px 200px at 50% -12%, var(--tint, var(--accent-soft)), transparent 68%);
    opacity: 0; transition: opacity .32s var(--ease);
  }
  .app-card:hover {
    transform: translateY(-6px);
    border-color: var(--tint-line, var(--accent-line));
    box-shadow: 0 22px 44px -22px var(--tint-line, var(--accent-line)), var(--shadow);
  }
  .app-card:hover::before, .app-card:hover::after { opacity: 1; }

  /* ── the preview window that holds each graphic ── */
  .card-preview {
    position: relative;
    display: block;
    border-radius: var(--r-lg);
    background:
      linear-gradient(165deg, var(--panel-2), var(--panel-3));
    border: 1px solid var(--border-soft);
    overflow: hidden;
    aspect-ratio: 200 / 108;
    transition: transform .35s var(--ease), border-color .3s var(--ease);
  }
  .app-card:hover .card-preview {
    transform: scale(1.025);
    border-color: var(--tint-line, var(--accent-line));
  }
  .card-preview svg { display: block; width: 100%; height: 100%; }
  /* diagonal sheen that sweeps across on hover */
  .card-preview::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 34%, rgba(255,255,255,.14) 48%, transparent 62%);
    transform: translateX(-120%);
    transition: transform .0s;
    pointer-events: none;
  }
  .app-card:hover .card-preview::after {
    transform: translateX(120%);
    transition: transform .9s var(--ease);
  }

  /* ── card footer: icon, title, arrow ── */
  .card-foot { display: flex; align-items: center; gap: 11px; padding: 0 3px; }
  .app-icon {
    width: 34px; height: 34px; border-radius: var(--r-md);
    display: grid; place-items: center;
    background: var(--tint, var(--accent-soft));
    color: var(--tint-fg, var(--accent));
    flex-shrink: 0;
    transition: transform .28s var(--ease);
  }
  .app-card:hover .app-icon { transform: scale(1.08) rotate(-4deg); }
  .app-title {
    font-size: 15px; font-weight: 700; letter-spacing: -.3px;
    flex: 1; min-width: 0;
  }
  .app-arrow {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--tint, var(--accent-soft));
    color: var(--tint-fg, var(--accent));
    transition: transform .28s var(--ease), background .28s var(--ease);
  }
  .app-card:hover .app-arrow {
    transform: translateX(3px);
    background: var(--tint-fg, var(--accent));
    color: #fff;
  }

  /* per-card accent tints */
  .app-card.c-board { --tint: var(--accent-soft);  --tint-fg: var(--accent);  --tint-line: var(--accent-line); }
  .app-card.c-timer { --tint: var(--warn-soft);    --tint-fg: var(--warn);    --tint-line: color-mix(in srgb, var(--warn) 40%, transparent); }
  .app-card.c-map   { --tint: var(--success-soft); --tint-fg: var(--success); --tint-line: color-mix(in srgb, var(--success) 40%, transparent); }

  /* ══════════════════════════════════════════════════════════════
     PREVIEW ARTWORK — shared bits
     ══════════════════════════════════════════════════════════════ */
  .art-panel  { fill: var(--panel); }
  .art-line   { stroke: var(--border); stroke-width: 1; }
  .art-soft   { fill: var(--border-soft); }
  .art-text   { fill: var(--text); }
  .art-muted  { fill: var(--muted); }
  .art-faint  { fill: var(--faint); }

  /* board: the flagged row breathes */
  .art-conflict { animation: artFlag 2.6s ease-in-out infinite; }
  @keyframes artFlag { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .art-scan { animation: artScan 4.2s var(--ease) infinite; }
  @keyframes artScan {
    0%, 100% { opacity: 0; transform: translateY(0); }
    12%      { opacity: .9; }
    50%      { opacity: .35; transform: translateY(40px); }
    88%      { opacity: 0; transform: translateY(40px); }
  }

  /* timer: real ticking second hands, offset per clock */
  .art-sec { animation: artSpin 6s linear infinite; }
  .art-sec.s2 { animation-duration: 6s; animation-delay: -2s; }
  .art-sec.s3 { animation-duration: 6s; animation-delay: -4s; }
  @keyframes artSpin { to { transform: rotate(360deg); } }

  /* map: zones light up in sequence */
  .art-zone { animation: artZone 5.2s ease-in-out infinite; }
  .art-zone.z2 { animation-delay: .35s; }
  .art-zone.z3 { animation-delay: .7s; }
  .art-zone.z4 { animation-delay: 1.05s; }
  @keyframes artZone { 0%,100% { opacity: .78; } 45% { opacity: 1; } }
  .art-pin { animation: artPin 3.4s ease-out infinite; transform-origin: center; }
  .art-pin.p2 { animation-delay: 1.1s; }
  .art-pin.p3 { animation-delay: 2.2s; }
  @keyframes artPin {
    0%      { r: 2.2; opacity: 1; }
    45%     { r: 6;   opacity: 0; }
    100%    { r: 6;   opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .art-conflict, .art-scan, .art-sec, .art-zone, .art-pin { animation: none !important; }
    .art-scan { opacity: 0; }
  }

  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .reveal { animation: fadeUp .6s var(--ease) both; }
  .reveal.d1 { animation-delay: .05s; }
  .reveal.d2 { animation-delay: .16s; }
  .reveal.d3 { animation-delay: .27s; }

  /* ══════════════════════════════════════════════════════════════
     RESPONSIVE
     ══════════════════════════════════════════════════════════════ */
  @media (max-width: 860px) {
    .apps { grid-template-columns: 1fr; gap: 12px; }
    .app-card { flex-direction: row; align-items: center; gap: 14px; padding: 12px; }
    .card-preview { width: 132px; flex-shrink: 0; }
    .card-foot { flex: 1; min-width: 0; padding: 0; }
  }
  @media (max-width: 560px) {
    .header-inner { gap: 10px; }
    .profile-name { display: none; }
    .profile-btn { padding: 4px; max-width: none; }
    .logo-mount { height: clamp(160px, 42vw, 210px); }
    h1.greeting { letter-spacing: -.8px; }
  }
  @media (max-width: 400px) {
    .theme-toggle { width: 54px; }
    html[data-theme="light"] .theme-toggle-knob { transform: translateX(22px); }
  }

  /* Short screens (laptops at 768–860px tall): compress instead of scrolling */
  @media (min-width: 861px) and (max-height: 900px) {
    .logo-mount { height: clamp(128px, 16vh, 168px); }
    h1.greeting { font-size: clamp(26px, 3.6vw, 38px); }
    .eyebrow { margin-bottom: 10px; }
    .apps-label { margin: 14px 0 12px; }
    main { padding-top: 18px; padding-bottom: 18px; }
  }
  @media (min-width: 861px) and (max-height: 780px) {
    .logo-mount { height: clamp(104px, 13vh, 132px); }
    h1.greeting { font-size: clamp(24px, 3vw, 32px); }
    .wordmark { height: 25px; }
    .apps-label { margin: 10px 0 10px; }
    .app-card { gap: 10px; padding: 10px 10px 12px; }
    .app-icon { width: 30px; height: 30px; }
    .app-title { font-size: 14px; }
    .logo-floor { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════════
     1 · SHARED THEME
     One localStorage key drives all four pages. Every page reads it on
     load and writes it on toggle, so the choice made here carries over
     to the Meeting Board, US Timer and US Map (and back).
     ══════════════════════════════════════════════════════════════════ */
  var THEME_KEY = 'infostride-theme';

  function safeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

  var themeBtn  = document.getElementById('themeToggle');
  var themeKnob = document.getElementById('themeKnob');
  var SUN  = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M3.5 12h-2M22.5 12h-2M18.4 5.6l-1.4 1.4M7 17l-1.4 1.4M18.4 18.4L17 17M7 7L5.6 5.6"/></svg>';
  var MOON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function applyTheme(theme) {
    var light = theme === 'light';
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', light ? '#f1f4fa' : '#090d15');
    if (themeBtn) {
      themeBtn.setAttribute('aria-checked', String(light));
      themeBtn.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
    }
    if (themeKnob) themeKnob.innerHTML = light ? SUN : MOON;
    if (window.__logoTheme) window.__logoTheme();
  }

  function readTheme() {
    var t = safeGet(THEME_KEY);
    if (t === 'light' || t === 'dark') return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }

  applyTheme(readTheme());

  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    safeSet(THEME_KEY, next);
  });

  // Live sync if another tab/page changes the theme
  window.addEventListener('storage', function (e) {
    if (e.key === THEME_KEY && e.newValue) applyTheme(e.newValue);
  });

  /* ══════════════════════════════════════════════════════════════════
     2 · WHO IS SIGNED IN  — wire this to your backend
     ------------------------------------------------------------------
     resolveUser() checks these in order and uses the first that works:

       1. window.INFOSTRIDE_USER — a global your server renders into the
          page. Simplest option; put this ABOVE this script:
              <script>window.INFOSTRIDE_USER =
                { name:"Bhavik Uppal", email:"bhavik@infostride.com",
                  role:"Admin" };<\/script>

       2. AUTH.endpoint — a URL returning JSON such as
          { "name":"Bhavik Uppal", "email":"...", "role":"..." }
          Set it below, e.g. endpoint: '/api/me'. Sent with
          credentials:'include' so your session cookie travels with it.

       3. ?name=Bhavik%20Uppal in the URL — handy if your login page
          redirects straight here.

       4. sessionStorage['infostride-user'] — a JSON string, if you'd
          rather stash the user at login time.

       5. AUTH.fallback — shown when none of the above are present, so
          the page still works when opened on its own.

     Accepted field names are flexible: name / fullName / full_name /
     displayName / username, and email / mail, role / title.
     ══════════════════════════════════════════════════════════════════ */
  var AUTH = {
    endpoint: null,                 // e.g. '/api/me'
    logoutUrl: null,                // e.g. '/logout'  (null = just clears locally)
    fallback: { name: 'Guest', email: '', role: '' }
  };

  var USER_KEY = 'infostride-user';

  function pick(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = obj && obj[keys[i]];
      if (typeof v === 'string' && v.trim()) return v.trim();
    }
    return '';
  }

  function normalise(raw) {
    if (!raw) return null;
    var src = raw.user || raw.data || raw;
    var name = pick(src, ['name', 'fullName', 'full_name', 'displayName', 'display_name', 'username', 'userName']);
    if (!name) {
      var first = pick(src, ['firstName', 'first_name', 'given_name']);
      var last  = pick(src, ['lastName', 'last_name', 'family_name']);
      name = (first + ' ' + last).trim();
    }
    if (!name) return null;
    return {
      name: name,
      email: pick(src, ['email', 'mail', 'emailAddress', 'email_address']),
      role:  pick(src, ['role', 'title', 'designation', 'department'])
    };
  }

  function fromQuery() {
    try {
      var q = new URLSearchParams(window.location.search);
      var name = q.get('name') || q.get('user');
      if (!name) return null;
      return normalise({ name: name, email: q.get('email') || '', role: q.get('role') || '' });
    } catch (e) { return null; }
  }

  function fromSession() {
    try {
      var raw = window.sessionStorage.getItem(USER_KEY);
      return raw ? normalise(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }

  function resolveUser() {
    // 1 · server-rendered global
    var u = normalise(window.INFOSTRIDE_USER);
    if (u) return Promise.resolve(u);

    // 3 · URL parameter   4 · sessionStorage   (checked before the network)
    u = fromQuery() || fromSession();

    // 2 · JSON endpoint
    if (AUTH.endpoint) {
      return fetch(AUTH.endpoint, { credentials: 'include', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { return normalise(j) || u || AUTH.fallback; })
        .catch(function () { return u || AUTH.fallback; });
    }
    return Promise.resolve(u || AUTH.fallback);
  }

  function initials(name) {
    return (name || '?').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0); }).join('').toUpperCase();
  }

  function firstName(name) { return (name || '').trim().split(/\s+/)[0] || 'there'; }

  function paintUser(user) {
    var isGuest = !user.name || user.name === AUTH.fallback.name;
    document.getElementById('greetName').textContent   = firstName(user.name);
    document.getElementById('profileName').textContent = firstName(user.name);
    document.getElementById('menuName').textContent    = user.name || 'Not signed in';
    document.getElementById('menuSub').textContent     = user.email || user.role || 'InfoStride';
    document.getElementById('avatarSm').textContent    = initials(user.name);
    document.getElementById('avatarLg').textContent    = initials(user.name);
    document.getElementById('eyebrowText').textContent =
      user.role ? user.role + ' · InfoStride Workspace' : 'InfoStride Workspace';
    document.title = 'InfoStride · Workspace' + (isGuest ? '' : ' · ' + firstName(user.name));
  }

  resolveUser().then(paintUser).catch(function () { paintUser(AUTH.fallback); });

  /* ── profile menu ─────────────────────────────────────────────── */
  var pBtn = document.getElementById('profileBtn');
  var pMenu = document.getElementById('profileMenu');

  function closeMenu() { pMenu.hidden = true; pBtn.setAttribute('aria-expanded', 'false'); }
  pBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = pMenu.hidden;
    pMenu.hidden = !open;
    pBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function (e) {
    if (!pMenu.hidden && !document.getElementById('profile').contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

  document.getElementById('signOutBtn').addEventListener('click', function () {
    try { window.sessionStorage.removeItem(USER_KEY); } catch (e) {}
    if (AUTH.logoutUrl) { window.location.href = AUTH.logoutUrl; return; }
    window.INFOSTRIDE_USER = null;
    paintUser(AUTH.fallback);
    closeMenu();
  });

  /* ══════════════════════════════════════════════════════════════════
     3 · THE 3-D LOGO
     Two chevrons from the InfoStride mark, extruded as real geometry and
     turned slowly with proper lighting. Falls back to a layered CSS-3D
     version if WebGL or the Three.js CDN is unavailable.
     ══════════════════════════════════════════════════════════════════ */
  var mount = document.getElementById('logoMount');

  function cssFallback() {
    var scene = document.getElementById('cssScene');
    var wrap = document.getElementById('logoCss');
    var LAYERS = 14;
    var html = '';
    for (var c = 0; c < 2; c++) {
      html += '<div class="css-chev" style="transform:translateX(' + (c * 52 - 26) + 'px) translateZ(0)">';
      for (var i = 0; i < LAYERS; i++) {
        var t = i / (LAYERS - 1);
        html += '<div class="css-layer" style="'
              + 'background:' + (c === 0 ? 'var(--logo-a)' : 'var(--logo-b)') + ';'
              + 'filter:brightness(' + (0.55 + 0.45 * t).toFixed(3) + ');'
              + 'transform:translateZ(' + ((i - LAYERS / 2) * 2.4).toFixed(2) + 'px);'
              + '"></div>';
      }
      html += '</div>';
    }
    scene.innerHTML = html;
    wrap.classList.add('on');
  }

  if (typeof THREE === 'undefined') { cssFallback(); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { cssFallback(); return; }
  if (!renderer || !renderer.getContext()) { cssFallback(); return; }

  renderer.outputEncoding = THREE.sRGBEncoding;     // colour-managed output
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  mount.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, mount.clientWidth / mount.clientHeight, 0.1, 100);
  camera.position.set(0, 0.35, 9.2);
  camera.lookAt(0, 0, 0);

  /* One chevron of the ">>" mark: the area between two nested V outlines. */
  function chevronShape(halfH, tipX, backX, thickness) {
    var s = new THREE.Shape();
    s.moveTo(backX, halfH);                       // outer: top-back
    s.lineTo(tipX, 0);                            // outer: tip
    s.lineTo(backX, -halfH);                      // outer: bottom-back
    s.lineTo(backX - thickness, -halfH);          // inner: bottom-back
    s.lineTo(tipX - thickness, 0);                // inner: tip
    s.lineTo(backX - thickness, halfH);           // inner: top-back
    s.closePath();
    return s;
  }

  var GEO = new THREE.ExtrudeGeometry(
    chevronShape(1.15, 0.62, -0.52, 0.62),
    { depth: 0.46, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3, curveSegments: 1 }
  );
  GEO.center();

  function themeColours() {
    var cs = getComputedStyle(document.documentElement);
    return [cs.getPropertyValue('--logo-a').trim() || '#e9edf6',
            cs.getPropertyValue('--logo-b').trim() || '#818cf8'];
  }

  var group = new THREE.Group();
  var mats = [];
  var COLS = themeColours();
  for (var i = 0; i < 2; i++) {
    var mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COLS[i]).convertSRGBToLinear(),
      metalness: 0.42, roughness: 0.26
    });
    mats.push(mat);
    var mesh = new THREE.Mesh(GEO, mat);
    mesh.position.x = i * 1.34 - 0.67;
    mesh.position.z = i * 0.06;
    group.add(mesh);
  }
  group.rotation.set(-0.06, -0.5, 0);
  scene.add(group);

  // Repaint the geometry when the theme flips
  window.__logoTheme = function () {
    var c = themeColours();
    for (var i = 0; i < mats.length; i++) {
      mats[i].color.set(new THREE.Color(c[i]).convertSRGBToLinear());
    }
    setLights();
  };

  var key  = new THREE.DirectionalLight(0xffffff, 0.85);
  var fill = new THREE.DirectionalLight(0xc7d2fe, 0.42);
  var rim  = new THREE.DirectionalLight(0x818cf8, 0.75);
  var amb  = new THREE.HemisphereLight(0xffffff, 0x1a2130, 0.55);
  key.position.set(4.5, 6, 7);
  fill.position.set(-6, -1.5, 4);
  rim.position.set(-3, 3.5, -6);
  scene.add(key, fill, rim, amb);

  function setLights() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    amb.groundColor.set(light ? 0xdfe4f0 : 0x1a2130);
    amb.intensity = light ? 0.72 : 0.55;
    key.intensity = light ? 0.78 : 0.85;
    rim.intensity = light ? 0.42 : 0.75;
    rim.color.set(light ? 0x6366f1 : 0x818cf8);
  }
  setLights();

  /* pointer parallax */
  var px = 0, py = 0, tx = 0, ty = 0;
  mount.addEventListener('pointermove', function (e) {
    var r = mount.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });
  mount.addEventListener('pointerleave', function () { tx = 0; ty = 0; });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = null;

  function frame(ts) {
    if (t0 === null) t0 = ts;
    var t = (ts - t0) / 1000;

    px += (tx - px) * 0.06;
    py += (ty - py) * 0.06;

    if (reduce) {
      group.rotation.y = -0.5 + px * 0.3;
      group.rotation.x = -0.06 + py * 0.18;
    } else {
      group.rotation.y = -0.42 + Math.sin(t * 0.5) * 0.52 + px * 0.34;
      group.rotation.x = -0.05 + Math.sin(t * 0.72) * 0.1 + py * 0.2;
      group.rotation.z = Math.sin(t * 0.33) * 0.045;
      group.position.y = Math.sin(t * 1.05) * 0.11;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function resize() {
    var w = mount.clientWidth, h = mount.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
