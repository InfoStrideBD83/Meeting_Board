  function renderMain() {
    const meetings = getFilteredMeetings();

    const pairs = [];
    for (let i = 0; i < meetings.length; i++) {
      for (let j = i + 1; j < meetings.length; j++) {
        if (doMeetingsOverlap(meetings[i], meetings[j])) pairs.push([meetings[i], meetings[j]]);
      }
    }
    const conflictKey = pairs.map(([a, b]) => `${a.id}:${b.id}`).sort().join(',');
    const showBanner = pairs.length > 0 && state.dismissedConflictKey !== conflictKey;

    return [
      renderPageHead(),
      renderStats(meetings, pairs.length),
      showBanner ? renderBanner(pairs, conflictKey) : '',
      renderToolbar(),
      state.view === 'table' ? renderTableSection(meetings) : renderCalendar(meetings),
    ].join('');
  }

  function renderPageHead() {
    const { month, year } = state.selectedMonth;
    return `
      <div class="page-head">
        <div>
          <h1 class="page-title">${MONTH_NAMES[month]} ${year}</h1>
          <p class="page-desc">Client demos across 5 time zones · conflicts flagged automatically</p>
        </div>
      </div>
    `;
  }

  function renderStats(meetings, conflictCount) {
    const scheduled = meetings.filter(m => m.status === 'Demo Scheduled').length;
    const completed = meetings.filter(m => m.status === 'Demo Completed').length;
    const positive  = meetings.filter(m => m.meeting_outcome === 'Positive').length;

    const tile = (icon, tone, val, label) => `
      <div class="stat">
        <div class="stat-icon ${tone}">${icon}</div>
        <div class="stat-body">
          <div class="stat-val">${val}</div>
          <div class="stat-label" title="${label}">${label}</div>
        </div>
      </div>`;

    return `
      <div class="stats">
        ${tile(ico.cal2, 't-accent', meetings.length, 'Meetings')}
        ${tile(ico.clock, 't-warn', scheduled, 'Upcoming')}
        ${tile(ico.check, 't-success', completed, 'Completed')}
        ${tile(conflictCount ? ico.warn : ico.users, conflictCount ? 't-danger' : 't-success',
               conflictCount || positive, conflictCount ? 'Conflicts' : 'Positive outcomes')}
      </div>
    `;
  }

  function renderBanner(pairs, key) {
    return `
      <div class="banner" role="alert">
        ${ico.warn}
        <div class="banner-body">
          <div class="banner-title">${pairs.length} scheduling conflict${pairs.length !== 1 ? 's' : ''} detected</div>
          <ul class="banner-list">
            ${pairs.map(([a, b]) => {
              const ma = MEMBERS.find(m => m.id === a.person_id) || {};
              const mb = MEMBERS.find(m => m.id === b.person_id) || {};
              return `<li>
                <b style="color:${ma.color || 'inherit'}">${esc(ma.name || 'Unknown')}</b> · ${esc(a.demo_topic)}
                &nbsp;⇄&nbsp;
                <b style="color:${mb.color || 'inherit'}">${esc(mb.name || 'Unknown')}</b> · ${esc(b.demo_topic)}
                <span class="date">— ${formatDate(a.date)}</span>
              </li>`;
            }).join('')}
          </ul>
        </div>
        <button class="icon-btn" onclick="dismissConflicts('${key}')" aria-label="Dismiss conflict warning">&times;</button>
      </div>
    `;
  }

  function renderToolbar() {
    const { month, year } = state.selectedMonth;
    const counts = {};
    meetingsData.forEach(m => {
      if (!m.date) return;
      const [y, mo] = m.date.split('-').map(Number);
      if (y === year && mo - 1 === month) counts[m.person_id] = (counts[m.person_id] || 0) + 1;
    });
    const allOn = state.activeFilters.size === 0;

    return `
      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-wrap">
            ${ico.search}
            <input id="searchInput" class="search-input" type="search" placeholder="Search topic, POC, person…"
              value="${esc(state.search)}" oninput="onSearch(this.value)" autocomplete="off" />
            ${state.search ? `<button class="search-clear" onclick="clearSearch()" aria-label="Clear search">&times;</button>` : ''}
          </div>

          ${state.view === 'calendar' ? renderCalNav() : `
          <div class="month-wrap">
            <div class="month-bar">
              <button class="month-nav" onclick="navMonth(-1)" aria-label="Previous month">${ico.chevL}</button>
              <button class="month-trigger" onclick="state.popovers.monthSelectorOpen = !state.popovers.monthSelectorOpen; render();"
                aria-expanded="${state.popovers.monthSelectorOpen}">
                ${ico.cal2}<span>${MONTH_SHORT[month]} ${year}</span>
              </button>
              <button class="month-nav" onclick="navMonth(1)" aria-label="Next month">${ico.chevR}</button>
            </div>
            ${state.popovers.monthSelectorOpen ? `
              <div class="month-dropdown">
                <div class="year-head">
                  <button class="month-nav" onclick="state.selectedMonth.year--; render();" aria-label="Previous year">${ico.chevL}</button>
                  <span class="mono">${year}</span>
                  <button class="month-nav" onclick="state.selectedMonth.year++; render();" aria-label="Next year">${ico.chevR}</button>
                </div>
                <div class="month-grid">
                  ${MONTH_SHORT.map((mn, i) => `
                    <button class="month-grid-btn" aria-current="${month === i}" onclick="changeMonth(${i}, ${year})">${mn}</button>
                  `).join('')}
                </div>
                <button class="btn" style="width:100%" onclick="jumpToday()">Jump to today</button>
              </div>
            ` : ''}
          </div>`}
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-row">
          <span class="filter-label">Team</span>
          <div class="chip-scroller">
            ${MEMBERS.map(m => {
              const on = allOn || state.activeFilters.has(m.id);
              return `
                <button class="chip" aria-pressed="${on}" onclick="toggleFilter('${m.id}')"
                  ondblclick="selectOnly('${m.id}')" title="${esc(m.email)} — double-click to isolate">
                  <span class="chip-avatar" style="background:${m.color}">${initials(m.name)}</span>
                  <span>${esc(m.name)}</span>
                  <span class="chip-count">${counts[m.id] || 0}</span>
                </button>`;
            }).join('')}
          </div>
          ${(!allOn || state.search) ? `<button class="link-btn" onclick="resetFilters()">Reset</button>` : ''}
        </div>
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════════════════
     RENDER — TABLE / CARDS
     ══════════════════════════════════════════════════════════════════ */
  function renderEmpty() {
    const filtering = state.search || state.activeFilters.size > 0;
    return `
      <div class="card">
        <div class="empty">
          <div class="empty-art">${ico.inbox}</div>
          <h4>${filtering ? 'No matching meetings' : 'Nothing scheduled yet'}</h4>
          <p>${filtering
            ? 'Try a different search term, month, or clear the team filter.'
            : `No demos are booked for ${MONTH_NAMES[state.selectedMonth.month]} ${state.selectedMonth.year}.`}</p>
          ${filtering
            ? `<button class="btn" onclick="resetFilters()">Clear filters</button>`
            : `<button class="btn btn-primary" onclick="openMeetingModal()">${ico.plus} Schedule a meeting</button>`}
        </div>
      </div>
    `;
  }

  function renderTableSection(meetings) {
    if (meetings.length === 0) return renderEmpty();
    return isMobile() ? renderCards(meetings) : renderTable(meetings);
  }

  function statusClass(s) {
    return s === 'Demo Completed' ? 's-completed' : s === 'Demo Canceled' ? 's-canceled' : 's-scheduled';
  }
  function outcomeClass(o) {
    return o === 'Positive' ? 'o-positive' : o === 'Negative' ? 'o-negative' : o === 'Neutral' ? 'o-neutral' : 'o-empty';
  }

  function statusSelect(m) {
    return `<select class="pill-select ${statusClass(m.status)}" onchange="updateMeetingStatus('${m.id}', this.value)" aria-label="Status">
      ${['Demo Scheduled','Demo Completed','Demo Canceled'].map(s =>
        `<option value="${s}" ${m.status === s ? 'selected' : ''}>${s.replace('Demo ','')}</option>`).join('')}
    </select>`;
  }

  function takenBySelect(m) {
    return `<select class="pill-select s-neutral sel-name" onchange="updateMeetingField('${m.id}','meeting_taken_by', this.value ? JSON.stringify([this.value]) : '')" aria-label="Meeting taken by">
      <option value="">— Select —</option>
      ${MEMBERS.map(mem => `<option value="${esc(mem.name)}" ${m.meeting_taken_by && m.meeting_taken_by.includes(mem.name) ? 'selected' : ''}>${esc(mem.name)}</option>`).join('')}
    </select>`;
  }

  function outcomeSelect(m) {
    return `<select class="pill-select sel-narrow ${outcomeClass(m.meeting_outcome)}" onchange="updateMeetingField('${m.id}','meeting_outcome', this.value)" aria-label="Outcome">
      <option value="">— Outcome —</option>
      ${['Positive','Neutral','Negative'].map(o => `<option value="${o}" ${m.meeting_outcome === o ? 'selected' : ''}>${o}</option>`).join('')}
    </select>`;
  }

  function notePopover(m, kind) {
    const isMom = kind === 'mom';
    const field = isMom ? 'mom' : 'post_demo_actions';
    const title = isMom ? 'Minutes of Meeting' : 'Post-Demo Actions';
    const inputId = `note_${field}_${m.id}`;

  /* ══════════════════════════════════════════════════════════════════
     RENDER — CALENDAR
     ══════════════════════════════════════════════════════════════════ */
  function calDayCount() {
    const w = window.innerWidth;
    if (w <= 520) return 2;
    if (w <= BP.mobile) return 3;
    if (w <= BP.tablet) return 5;
    return 7;
  }

  // The days currently shown in the calendar
  function visibleDays() {
    const n = calDayCount();
    return Array.from({ length: n }, (_, i) => {
      const d = new Date(state.calendarWeekStart);
      d.setDate(d.getDate() + i);
      return d;
    });
  }

  // Which day column a meeting falls in, in the chosen display zone
  function meetingLocalDay(m, targetZone) {
    const mz = ZONES[m.zone_index] || ZONES[0];
    const p = fromUTCFull(toUTC(m.date, m.time, mz.iana), targetZone.iana);
    return { dayStr: toDateStr(new Date(p.year, p.month - 1, p.day)), hour: p.hour, minute: p.minute };
  }

  /* Only span the hours actually in use (padded by one), so rows stay
     tall enough to read instead of always rendering a fixed 06:00–23:00. */
  const MIN_HOUR_SPAN = 9;
  function calHourRange(meetings, targetZone, days) {
    const dayStrs = new Set(days.map(toDateStr));
    let lo = 24, hi = 0, found = false;

    meetings.forEach(m => {
      const p = meetingLocalDay(m, targetZone);
      if (!dayStrs.has(p.dayStr)) return;
      found = true;
      const start = p.hour + p.minute / 60;
      lo = Math.min(lo, Math.floor(start));
      hi = Math.max(hi, Math.ceil(start + (Number(m.duration) || 30) / 60));
    });

    if (!found) { lo = 8; hi = 20; }
    lo = Math.max(0, lo - 1);
    hi = Math.min(24, hi + 1);

    // widen symmetrically if the span is too narrow
    if (hi - lo < MIN_HOUR_SPAN) {
      const need = MIN_HOUR_SPAN - (hi - lo);
      const up = Math.min(lo, Math.ceil(need / 2));
      lo -= up;
      hi = Math.min(24, hi + (need - up));
      if (hi - lo < MIN_HOUR_SPAN) lo = Math.max(0, hi - MIN_HOUR_SPAN);
    }
    return { lo, hi };
  }

  function calWeekLabel(days) {
    const fmtD = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return days.length === 1
      ? days[0].toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })
      : `${fmtD(days[0])} – ${fmtD(days[days.length - 1])}, ${days[days.length - 1].getFullYear()}`;
  }

  function renderCalNav() {
    const days = visibleDays();
    const n = days.length;
    return `
      <div style="display:inline-flex; gap:6px; flex-shrink:0;">
        <button class="btn btn-icon" onclick="shiftWeek(-${n})" aria-label="Previous ${n} days">${ico.chevL}</button>
        <button class="btn" onclick="jumpToday()">Today</button>
        <button class="btn btn-icon" onclick="shiftWeek(${n})" aria-label="Next ${n} days">${ico.chevR}</button>
      </div>
      <span class="week-label">${calWeekLabel(days)}</span>
      <select class="field-select" onchange="state.calendarZoneIdx = Number(this.value); render();" aria-label="Display timezone">
        ${ZONES.map((z, i) => `<option value="${i}" ${state.calendarZoneIdx === i ? 'selected' : ''}>Show in ${z.label} — ${z.iana.split('/')[1].replace('_', ' ')}</option>`).join('')}
      </select>
    `;
  }

  function renderCalendar(meetings) {
    const targetZone = ZONES[state.calendarZoneIdx];
    const days = visibleDays();
    const dayCount = days.length;

    const { lo, hi } = calHourRange(meetings, targetZone, days);
    const hours = hi - lo;
    const totalMin = hours * 60;
    const pct = min => (min / totalMin) * 100;   // minutes -> % of column height

    const conflictIds = getConflictingIds(meetings);
    const now = new Date();
    const nowParts = fromUTCFull(now, targetZone.iana);
    const nowMin = nowParts.hour * 60 + nowParts.minute;
    const todayStr = toDateStr(now);

    return `
      <div class="cal-card">
        <div class="cal-scroll" id="calScroll">
          <div class="cal-grid" style="--days:${dayCount}">
            <div class="cal-corner"></div>
            ${days.map(d => {
              const isToday = toDateStr(d) === todayStr;
              return `<div class="cal-dayhead ${isToday ? 'today' : ''}">
                <span class="dow">${d.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                <span class="dom">${d.getDate()}</span>
              </div>`;
            }).join('')}

            <div class="cal-gutter">
              ${Array.from({ length: hours }, (_, h) =>
                `<div class="gutter-hour mono">${String(lo + h).padStart(2, '0')}</div>`).join('')}
            </div>

            ${days.map(d => {
              const dayStr = toDateStr(d);
              const isToday = dayStr === todayStr;
              const dayMtgs = meetings
                .filter(m => meetingLocalDay(m, targetZone).dayStr === dayStr)
                .map(m => {
                  const p = meetingLocalDay(m, targetZone);
                  const s = p.hour * 60 + p.minute;
                  return { m, p, s, e: s + (Number(m.duration) || 30) };
                })
                .sort((a, b) => a.s - b.s || a.e - b.e);

              /* Lay overlapping meetings out side by side instead of stacking
                 them, so a clash is actually visible. */
              const laneEnds = [];
              dayMtgs.forEach(item => {
                let lane = laneEnds.findIndex(end => end <= item.s);
                if (lane === -1) { lane = laneEnds.length; laneEnds.push(item.e); }
                else laneEnds[lane] = item.e;
                item.lane = lane;
              });
              const laneCount = Math.max(1, laneEnds.length);

              return `<div class="cal-col ${isToday ? 'is-today' : ''}">
                ${Array.from({ length: hours }, (_, h) =>
                  `<div class="hr-line" style="top:${pct(h * 60)}%"></div>`).join('')}

                ${isToday && nowMin >= lo * 60 && nowMin <= hi * 60
                  ? `<div class="now-line" style="top:${pct(nowMin - lo * 60)}%"></div>` : ''}

                ${dayMtgs.map(({ m, p, s: startMin, e: endMin, lane }) => {
                  const member = MEMBERS.find(x => x.id === m.person_id) || {};
                  const dur = endMin - startMin;
                  const clock = `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
                  const endClock = `${String(Math.floor(endMin / 60) % 24).padStart(2, '0')}:${String(endMin % 60).padStart(2, '0')}`;
                  // Keep the start edge truthful, give short meetings a readable
                  // floor, and never let a block spill past the last hour (a
                  // 23:30 + 45m demo crosses midnight).
                  const topPct = pct(startMin - lo * 60);
                  const hPct = Math.min(Math.max(pct(dur), pct(10)), 100 - topPct);
                  const wPct = 100 / laneCount;
                  return `<button class="cal-event ${conflictIds.has(m.id) ? 'conflict' : ''}"
                    style="top:${topPct}%; height:${hPct}%;
                           left:calc(${lane * wPct}% + 2px); right:auto; width:calc(${wPct}% - 4px);
                           background:${member.color || 'var(--accent)'}"
                    onclick="openMeetingModal('${m.id}')"
                    title="${esc(member.name)} · ${esc(m.demo_topic)} · ${clock}–${endClock} ${targetZone.label}${conflictIds.has(m.id) ? ' · CLASHES' : ''}">
                    <span class="ev-title">${esc(m.demo_topic)}</span>
                    <span class="ev-sub">${clock} · ${esc(member.name)}</span>
                  </button>`;
                }).join('')}
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  /* Size the calendar to the space left on screen so the page never scrolls */
  function fitCalendar() {
    const scroll = document.getElementById('calScroll');
    if (!scroll) return;

    const top = scroll.getBoundingClientRect().top;
    const bottomGap = 16;
    const avail = Math.max(200, window.innerHeight - top - bottomGap);
    scroll.style.setProperty('--cal-h', avail + 'px');

    // Blocks too short for two lines of text switch to a compact style
    scroll.querySelectorAll('.cal-event').forEach(ev => {
      ev.classList.toggle('compact', ev.offsetHeight < 34);
    });
  }

                <input type="text" class="control" id="m_poc_population_count" value="${esc(m.poc_population_count)}" placeholder="39,500,000" />
              </div>
            </div>

            <div class="fgroup">
              <label for="m_poc_county_name">County / Company</label>
              <input type="text" class="control" id="m_poc_county_name" value="${esc(m.poc_county_name)}" placeholder="Los Angeles County" />
            </div>

            <div class="fieldset-label">Notes</div>

            <div class="fgroup">
              <label for="m_mom">Minutes of meeting</label>
              <textarea class="control" id="m_mom" rows="3" placeholder="Key discussion points, decisions…">${esc(m.mom)}</textarea>
            </div>

            <div class="fgroup">
              <label for="m_actions">Post-demo actions</label>
              <textarea class="control" id="m_actions" rows="2" placeholder="Follow-ups, owners, deadlines…">${esc(m.post_demo_actions)}</textarea>
            </div>
          </div>

          <div class="modal-foot">
            ${isEdit ? `<button class="btn btn-danger-text" style="margin-right:auto" onclick="closeModal(); deleteMeeting('${m.id}')">${ico.trash} Delete</button>` : ''}
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitModal()">${isEdit ? 'Save changes' : 'Create meeting'}</button>
          </div>
        </div>
      </div>
    `;
  }

  function submitModal() {
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const topic = val('m_topic');
    if (!topic) {
      alert('Please enter a demo topic.');
      const el = document.getElementById('m_topic'); if (el) el.focus();
      return;
    }
    if (!val('m_date')) { alert('Please choose a date.'); return; }

    saveMeeting({
      ...state.activeModal,
      demo_topic: topic,
      person_id: val('m_person'),
      status: val('m_status'),
      date: val('m_date'),
      time: val('m_time') || '10:00',
      zone_index: Number(val('m_zone')),
      duration: Number(val('m_duration')),
      poc_name: val('m_poc_name'),
      poc_phone: val('m_poc_phone'),
      poc_email: val('m_poc_email'),
      poc_state: val('m_poc_state'),
      poc_state_name: val('m_poc_state_name'),
      poc_population_count: val('m_poc_population_count'),
      poc_county_name: val('m_poc_county_name'),
      mom: val('m_mom'),
      post_demo_actions: val('m_actions'),
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     GLOBAL LISTENERS
     ══════════════════════════════════════════════════════════════════ */
  // Re-render when crossing a responsive breakpoint (table <-> cards, calendar day count)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const b = currentBucket();
      if (b !== state.bucket || state.view === 'calendar') {
        state.bucket = b;
        render();
      } else {
        fitCalendar();
      }
    }, 140);
  });

  // Escape closes overlays; click outside closes month dropdown
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.importPreview) { state.importPreview = null; render(); return; }
    if (state.activeModal) { closeModal(); return; }
    if (state.popovers.pocId || state.popovers.momId || state.popovers.actionsId || state.popovers.monthSelectorOpen) {
      closeAllPopovers();
    }
  });

  document.addEventListener('click', e => {
    if (state.popovers.monthSelectorOpen && !e.target.closest('.month-wrap')) {
      state.popovers.monthSelectorOpen = false;
      render();
    }
  }, true);

  // Theme changed on another InfoStride page / tab
  window.addEventListener('storage', e => {
    if (e.key === THEME_KEY && (e.newValue === 'light' || e.newValue === 'dark')) {
      applyTheme(e.newValue);
      render();
    }
  });

  // Boot
  initTheme();
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
  </script>
</body>
</html>
