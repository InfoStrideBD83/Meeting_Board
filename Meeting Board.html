        `<option value="${s}" ${m.status === s ? 'selected' : ''}>${s.replace('Demo ','')}</option>`).join('')}
    </select>`;
  }

  function takenBySelect(m) {
    let takenByName = '';
    try { takenByName = m.meeting_taken_by ? JSON.parse(m.meeting_taken_by)[0] || '' : ''; }
    catch (e) { takenByName = m.meeting_taken_by || ''; }
    const isKnown = TAKEN_BY_OPTIONS.includes(takenByName);
    const isOther = Boolean(takenByName) && !isKnown;
    const inputId = `tb_other_${m.id}`;

    return `<span class="taken-by-wrap">
      <select class="pill-select s-neutral sel-name" onchange="onTakenByChange('${m.id}', this.value)" aria-label="Meeting taken by">
        <option value="">— Select —</option>
        ${TAKEN_BY_OPTIONS.map(name => `<option value="${esc(name)}" ${!isOther && takenByName === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}
        <option value="Others" ${isOther ? 'selected' : ''}>Others</option>
      </select>
      <input type="text" class="taken-by-other" id="${inputId}"
        style="${isOther ? '' : 'display:none'}"
        value="${esc(isOther ? takenByName : '')}"
        placeholder="Enter name"
        onkeydown="if(event.key==='Enter') this.blur();"
        onblur="commitTakenByOther('${m.id}', this.value)" />

  }

  function onTakenByChange(id, value) {
    const input = document.getElementById('tb_other_' + id);
    if (value === 'Others') {
      if (input) { input.style.display = ''; input.focus(); }
      return;
    }
    if (input) input.style.display = 'none';
    updateMeetingField(id, 'meeting_taken_by', value ? JSON.stringify([value]) : '');
  }

  function commitTakenByOther(id, value) {
    const v = value.trim();
    if (v) updateMeetingField(id, 'meeting_taken_by', JSON.stringify([v]));
  }

  function outcomeSelect(m) {
    return `<select class="pill-select sel-narrow ${outcomeClass(m.meeting_outcome)}" onchange="updateMeetingField('${m.id}','meeting_outcome', this.value)" aria-label="Outcome">

  /* ══════════════════════════════════════════════════════════════════
     RENDER — CALENDAR
     ══════════════════════════════════════════════════════════════════ */
  function calDayCount() {
    const w = window.innerWidth;
    if (w <= 520) return 2;
    if (w <= BP.mobile) return 3;
    if (w <= BP.tablet) return 5;
    return 7;
  }

  // The days currently shown in the calendar
  function visibleDays() {
    const n = calDayCount();
    return Array.from({ length: n }, (_, i) => {
      const d = new Date(state.calendarWeekStart);
      d.setDate(d.getDate() + i);
      return d;
    });
  }

  // Which day column a meeting falls in, in the chosen display zone
  function meetingLocalDay(m, targetZone) {
    const mz = ZONES[m.zone_index] || ZONES[0];
    const p = fromUTCFull(toUTC(m.date, m.time, mz.iana), targetZone.iana);
    return { dayStr: toDateStr(new Date(p.year, p.month - 1, p.day)), hour: p.hour, minute: p.minute };
  }

  /* Only span the hours actually in use (padded by one), so rows stay
     tall enough to read instead of always rendering a fixed 06:00–23:00. */
  const MIN_HOUR_SPAN = 9;
  function calHourRange(meetings, targetZone, days) {
    const dayStrs = new Set(days.map(toDateStr));
    let lo = 24, hi = 0, found = false;

    meetings.forEach(m => {
      const p = meetingLocalDay(m, targetZone);
      if (!dayStrs.has(p.dayStr)) return;
      found = true;
      const start = p.hour + p.minute / 60;
      lo = Math.min(lo, Math.floor(start));
      hi = Math.max(hi, Math.ceil(start + (Number(m.duration) || 30) / 60));
    });

    if (!found) { lo = 8; hi = 20; }
    lo = Math.max(0, lo - 1);
    hi = Math.min(24, hi + 1);

    // widen symmetrically if the span is too narrow
    if (hi - lo < MIN_HOUR_SPAN) {
      const need = MIN_HOUR_SPAN - (hi - lo);
      const up = Math.min(lo, Math.ceil(need / 2));
      lo -= up;
      hi = Math.min(24, hi + (need - up));
      if (hi - lo < MIN_HOUR_SPAN) lo = Math.max(0, hi - MIN_HOUR_SPAN);
    }
    return { lo, hi };
  }

  function calWeekLabel(days) {
    const fmtD = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return days.length === 1
      ? days[0].toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })
      : `${fmtD(days[0])} – ${fmtD(days[days.length - 1])}, ${days[days.length - 1].getFullYear()}`;
  }

  function renderCalNav() {
    const days = visibleDays();
    const n = days.length;
    return `
      <div style="display:inline-flex; gap:6px; flex-shrink:0;">
        <button class="btn btn-icon" onclick="shiftWeek(-${n})" aria-label="Previous ${n} days">${ico.chevL}</button>
        <button class="btn" onclick="jumpToday()">Today</button>
        <button class="btn btn-icon" onclick="shiftWeek(${n})" aria-label="Next ${n} days">${ico.chevR}</button>
      </div>
      <span class="week-label">${calWeekLabel(days)}</span>
      <select class="field-select" onchange="state.calendarZoneIdx = Number(this.value); render();" aria-label="Display timezone">
        ${ZONES.map((z, i) => `<option value="${i}" ${state.calendarZoneIdx === i ? 'selected' : ''}>Show in ${z.label} — ${z.iana.split('/')[1].replace('_', ' ')}</option>`).join('')}
      </select>
    `;
  }

  function renderCalendar(meetings) {
    const targetZone = ZONES[state.calendarZoneIdx];
    const days = visibleDays();
    const dayCount = days.length;

    const { lo, hi } = calHourRange(meetings, targetZone, days);
    const hours = hi - lo;
    const totalMin = hours * 60;
    const pct = min => (min / totalMin) * 100;   // minutes -> % of column height

    const conflictIds = getConflictingIds(meetings);
    const now = new Date();
    const nowParts = fromUTCFull(now, targetZone.iana);
    const nowMin = nowParts.hour * 60 + nowParts.minute;
    const todayStr = toDateStr(now);

    return `
      <div class="cal-card">
        <div class="cal-scroll" id="calScroll">
          <div class="cal-grid" style="--days:${dayCount}">
            <div class="cal-corner"></div>
            ${days.map(d => {
              const isToday = toDateStr(d) === todayStr;
              return `<div class="cal-dayhead ${isToday ? 'today' : ''}">
                <span class="dow">${d.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                <span class="dom">${d.getDate()}</span>
              </div>`;
            }).join('')}

            <div class="cal-gutter">
              ${Array.from({ length: hours }, (_, h) =>
                `<div class="gutter-hour mono">${String(lo + h).padStart(2, '0')}</div>`).join('')}
            </div>

            ${days.map(d => {
              const dayStr = toDateStr(d);
              const isToday = dayStr === todayStr;
              const dayMtgs = meetings
                .filter(m => meetingLocalDay(m, targetZone).dayStr === dayStr)
                .map(m => {
                  const p = meetingLocalDay(m, targetZone);
                  const s = p.hour * 60 + p.minute;
                  return { m, p, s, e: s + (Number(m.duration) || 30) };
                })
                .sort((a, b) => a.s - b.s || a.e - b.e);

              /* Lay overlapping meetings out side by side instead of stacking
                 them, so a clash is actually visible. */
              const laneEnds = [];
              dayMtgs.forEach(item => {
                let lane = laneEnds.findIndex(end => end <= item.s);
                if (lane === -1) { lane = laneEnds.length; laneEnds.push(item.e); }
                else laneEnds[lane] = item.e;
                item.lane = lane;
              });
              const laneCount = Math.max(1, laneEnds.length);

              return `<div class="cal-col ${isToday ? 'is-today' : ''}">
                ${Array.from({ length: hours }, (_, h) =>
                  `<div class="hr-line" style="top:${pct(h * 60)}%"></div>`).join('')}

                ${isToday && nowMin >= lo * 60 && nowMin <= hi * 60
                  ? `<div class="now-line" style="top:${pct(nowMin - lo * 60)}%"></div>` : ''}

                ${dayMtgs.map(({ m, p, s: startMin, e: endMin, lane }) => {
                  const member = MEMBERS.find(x => x.id === m.person_id) || {};
                  const dur = endMin - startMin;
                  const clock = `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
                  const endClock = `${String(Math.floor(endMin / 60) % 24).padStart(2, '0')}:${String(endMin % 60).padStart(2, '0')}`;
                  // Keep the start edge truthful, give short meetings a readable
                  // floor, and never let a block spill past the last hour (a
                  // 23:30 + 45m demo crosses midnight).
                  const topPct = pct(startMin - lo * 60);
                  const hPct = Math.min(Math.max(pct(dur), pct(10)), 100 - topPct);
                  const wPct = 100 / laneCount;
                  return `<button class="cal-event ${conflictIds.has(m.id) ? 'conflict' : ''}"
                    style="top:${topPct}%; height:${hPct}%;
                           left:calc(${lane * wPct}% + 2px); right:auto; width:calc(${wPct}% - 4px);
                           background:${member.color || 'var(--accent)'}"
                    onclick="openMeetingModal('${m.id}')"
                    title="${esc(member.name)} · ${esc(m.demo_topic)} · ${clock}–${endClock} ${targetZone.label}${conflictIds.has(m.id) ? ' · CLASHES' : ''}">
                    <span class="ev-title">${esc(m.demo_topic)}</span>
                    <span class="ev-sub">${clock} · ${esc(member.name)}</span>
                  </button>`;
                }).join('')}
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  /* Size the calendar to the space left on screen so the page never scrolls */
  function fitCalendar() {
    const scroll = document.getElementById('calScroll');
    if (!scroll) return;

    const top = scroll.getBoundingClientRect().top;
    const bottomGap = 16;
    const avail = Math.max(200, window.innerHeight - top - bottomGap);
    scroll.style.setProperty('--cal-h', avail + 'px');

    // Blocks too short for two lines of text switch to a compact style
    scroll.querySelectorAll('.cal-event').forEach(ev => {
      ev.classList.toggle('compact', ev.offsetHeight < 34);
    });
  }

  /* Size the table to the space left on screen so the page never scrolls —
     only the table itself scrolls, left-right and top-bottom. */
  function fitTableScroll() {
    const scroll = document.getElementById('tableScroll');
    if (!scroll) return;

    const top = scroll.getBoundingClientRect().top;
    const bottomGap = 16;
    const avail = Math.max(160, window.innerHeight - top - bottomGap);
    scroll.style.setProperty('--tbl-h', avail + 'px');
  }

  /* ══════════════════════════════════════════════════════════════════
     MODAL
     ══════════════════════════════════════════════════════════════════ */
  function openMeetingModal(meetingId = null) {
    if (meetingId) {
      const existing = meetingsData.find(m => m.id === meetingId);
      if (!existing) return;
      if (!canManageMeeting(existing)) { alert('Only the person this meeting is scheduled by, or an admin, can edit it.'); return; }
      state.activeModal = { ...existing };
    } else {
      const defaultPersonId = (!IS_ADMIN && CURRENT_MEMBER) ? CURRENT_MEMBER.id : (MEMBERS[0] ? MEMBERS[0].id : '');
      state.activeModal = {
        demo_topic: '', person_id: defaultPersonId,
        date: toDateStr(new Date()), time: '10:00', zone_index: 0, duration: 30,
        status: 'Demo Scheduled',
        poc_name: '', poc_state: '', poc_email: '', poc_phone: '', poc_country: '',
        poc_state_name: '', poc_population_count: '', poc_county_name: '',
        mom: '', meeting_taken_by: '', meeting_outcome: '', post_demo_actions: ''
      };
    }
    render();
    setTimeout(() => { const el = document.getElementById('m_topic_select'); if (el) el.focus(); }, 30);
  }

  function closeModal() { state.activeModal = null; render(); }

  function renderModal() {
    const m = state.activeModal;
    const isEdit = Boolean(m.id);
    const fixedTopics = TOPIC_OPTIONS.slice(0, -1); // everything except "Others"
    const topicIsOther = Boolean(m.demo_topic) && !fixedTopics.includes(m.demo_topic);

    const countryIsOther = Boolean(m.poc_country) && !COUNTRIES.includes(m.poc_country);
    const stateListForRender = countryIsOther ? [] : statesForCountry(m.poc_country);
    const stateMatch = stateListForRender.find(([name]) => name === m.poc_state_name);
    const stateIsOther = Boolean(m.poc_state_name) && !stateMatch;
    const codeIsOther = Boolean(m.poc_state) && !(stateMatch && stateMatch[1] === m.poc_state);

    return `
      <div class="overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-label="${isEdit ? 'Edit meeting' : 'New meeting'}">
          <div class="modal-head">
            <div>
              <h3>${isEdit ? 'Edit meeting' : 'Schedule a meeting'}</h3>
              <p>${isEdit ? 'Update the demo details below' : 'Times convert across all 5 zones automatically'}</p>
            </div>
            <button class="pop-close" onclick="closeModal()" aria-label="Close">&times;</button>
          </div>

          <div class="modal-body">
            <div class="fieldset-label">Meeting</div>

            <div class="fgroup">
              <label for="m_topic_select">Demo topic <span class="req-star">*</span></label>
              <select class="control" id="m_topic_select" onchange="onTopicChange()">
                <option value="">Select a topic</option>
                ${TOPIC_OPTIONS.map(t => `<option value="${t}" ${(t === 'Others' ? topicIsOther : m.demo_topic === t) ? 'selected' : ''}>${t}</option>`).join('')}
              </select>
            </div>
            <div class="fgroup" id="m_topic_other_wrap" ${topicIsOther ? '' : 'style="display:none"'}>
              <label for="m_topic_other">Topic name <span class="req-star">*</span></label>
              <input type="text" class="control" id="m_topic_other" value="${esc(topicIsOther ? m.demo_topic : '')}" placeholder="Enter the demo topic" />
            </div>

            <div class="grid-2">
              <div class="fgroup">
                <label for="m_person">Scheduled By <span class="req-star">*</span></label>
                <select class="control" id="m_person" ${IS_ADMIN ? '' : 'disabled'}>
                  ${MEMBERS.map(mem => `<option value="${mem.id}" ${m.person_id === mem.id ? 'selected' : ''}>${esc(mem.name)}</option>`).join('')}
                </select>
                ${IS_ADMIN ? '' : '<p class="field-hint">Only an admin can reassign this meeting.</p>'}
              </div>
              <div class="fgroup">
                <label for="m_status">Status <span class="req-star">*</span></label>
                <select class="control" id="m_status">
                  ${['Demo Scheduled','Demo Completed','Demo Canceled'].map(s =>
                    `<option value="${s}" ${m.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid-3">
              <div class="fgroup">
                <label for="m_date">Date <span class="req-star">*</span></label>
                <input type="date" class="control" id="m_date" value="${esc(m.date)}" />
              </div>
              <div class="fgroup">
                <label for="m_time">Start time <span class="req-star">*</span></label>
                <input type="time" class="control" id="m_time" value="${esc(m.time || '10:00')}" />
              </div>
              <div class="fgroup">
                <label for="m_zone">Time zone <span class="req-star">*</span></label>
                <select class="control" id="m_zone">
                  ${ZONES.map((z, i) => `<option value="${i}" ${m.zone_index === i ? 'selected' : ''}>${z.label}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="fgroup">
              <label for="m_duration">Duration <span class="req-star">*</span></label>
              <select class="control" id="m_duration">
                ${[15,30,45,60,90,120].map(d => `<option value="${d}" ${Number(m.duration) === d ? 'selected' : ''}>${d} minutes</option>`).join('')}
              </select>
            </div>

            <div class="fieldset-label">Point of contact</div>

            <div class="grid-2">
              <div class="fgroup">
                <label for="m_poc_name">Name <span class="req-star">*</span></label>
                <input type="text" class="control" id="m_poc_name" value="${esc(m.poc_name)}" placeholder="Contact person" />
              </div>
              <div class="fgroup">
                <label for="m_poc_phone">Phone <span class="req-star">*</span></label>
                <input type="tel" class="control" id="m_poc_phone" value="${esc(m.poc_phone)}" placeholder="+1 (555) 000-0000" />
              </div>
            </div>

            <div class="fgroup">
              <label for="m_poc_email">Email <span class="req-star">*</span></label>
              <input type="email" class="control" id="m_poc_email" value="${esc(m.poc_email)}" placeholder="name@company.com" />
            </div>

            <div class="fgroup">
              <label for="m_country">Country <span class="req-star">*</span></label>
              <select class="control" id="m_country" onchange="onCountryChange()">
                <option value="">Select a country</option>
                ${COUNTRIES.map(c => `<option value="${esc(c)}" ${!countryIsOther && m.poc_country === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                <option value="Others" ${countryIsOther ? 'selected' : ''}>Others</option>
              </select>
            </div>
            <div class="fgroup" id="m_country_other_wrap" ${countryIsOther ? '' : 'style="display:none"'}>
              <label for="m_country_other">Country name <span class="req-star">*</span></label>
              <input type="text" class="control" id="m_country_other" value="${esc(countryIsOther ? m.poc_country : '')}" placeholder="Enter the country" />
            </div>

            <div class="grid-3">
              <div class="fgroup">
                <label for="m_poc_state_name">State <span class="req-star">*</span></label>
                <select class="control" id="m_poc_state_name" onchange="onStateChange()">
                  <option value="">Select a state</option>
                  ${stateListForRender.map(([name]) => `<option value="${esc(name)}" ${!stateIsOther && m.poc_state_name === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}
                  <option value="Others" ${stateIsOther ? 'selected' : ''}>Others</option>
                </select>
              </div>
              <div class="fgroup">
                <label for="m_poc_state">State code <span class="req-star">*</span></label>
                <select class="control" id="m_poc_state" onchange="onStateCodeChange()">
                  <option value="">Select a code</option>
                  ${stateMatch ? `<option value="${esc(stateMatch[1])}" ${!codeIsOther ? 'selected' : ''}>${esc(stateMatch[1])}</option>` : ''}
                  <option value="Others" ${codeIsOther ? 'selected' : ''}>Others</option>
                </select>
              </div>
              <div class="fgroup">
                <label for="m_poc_population_count">Population <span class="field-hint" style="display:inline;text-transform:none;">(optional)</span></label>
                <input type="text" class="control" id="m_poc_population_count" value="${esc(m.poc_population_count)}" placeholder="39,500,000" />
              </div>
            </div>
            <div class="fgroup" id="m_poc_state_other_wrap" ${stateIsOther ? '' : 'style="display:none"'}>
              <label for="m_poc_state_other">State name <span class="req-star">*</span></label>
              <input type="text" class="control" id="m_poc_state_other" value="${esc(stateIsOther ? m.poc_state_name : '')}" placeholder="Enter the state / province" />
            </div>
            <div class="fgroup" id="m_poc_state_code_other_wrap" ${codeIsOther ? '' : 'style="display:none"'}>
              <label for="m_poc_state_code_other">State code <span class="req-star">*</span></label>
              <input type="text" class="control" id="m_poc_state_code_other" value="${esc(codeIsOther ? m.poc_state : '')}" placeholder="e.g. CA" />
            </div>

            <div class="fgroup">
              <label for="m_poc_county_name">County / Company <span class="req-star">*</span></label>
              <input type="text" class="control" id="m_poc_county_name" value="${esc(m.poc_county_name)}" placeholder="Los Angeles County" />
            </div>
          </div>

          <div class="modal-foot">
            ${isEdit ? `<button class="btn btn-danger-text" style="margin-right:auto" onclick="closeModal(); deleteMeeting('${m.id}')">${ico.trash} Delete</button>` : ''}
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitModal()">${isEdit ? 'Save changes' : 'Create meeting'}</button>
          </div>
        </div>
      </div>
    `;
  }

  // Demo topic: swap the free-text box in/out when "Others" is picked.
  function onTopicChange() {
    const sel = document.getElementById('m_topic_select');
    const wrap = document.getElementById('m_topic_other_wrap');
    if (sel && wrap) wrap.style.display = sel.value === 'Others' ? '' : 'none';
  }

  // Country -> State -> State code: each rebuilds the dropdown below it,
  // and each has an "Others" option that swaps in a free-text box.
  function onCountryChange() {
    const country = document.getElementById('m_country').value;
    const countryWrap = document.getElementById('m_country_other_wrap');
    if (countryWrap) countryWrap.style.display = country === 'Others' ? '' : 'none';

    const stateSel = document.getElementById('m_poc_state_name');
    const list = country === 'Others' ? [] : statesForCountry(country);
    stateSel.innerHTML = '<option value="">Select a state</option>' +
      list.map(([name]) => `<option value="${esc(name)}">${esc(name)}</option>`).join('') +
      '<option value="Others">Others</option>';
    onStateChange();
  }

  function onStateChange() {
    const country = document.getElementById('m_country').value;
    const stateName = document.getElementById('m_poc_state_name').value;
    const stateWrap = document.getElementById('m_poc_state_other_wrap');
    if (stateWrap) stateWrap.style.display = stateName === 'Others' ? '' : 'none';

    const codeSel = document.getElementById('m_poc_state');
    const match = country === 'Others' ? null : statesForCountry(country).find(([name]) => name === stateName);
    codeSel.innerHTML = '<option value="">Select a code</option>' +
      (match ? `<option value="${esc(match[1])}" selected>${esc(match[1])}</option>` : '') +
      '<option value="Others">Others</option>';
    onStateCodeChange();
  }

  function onStateCodeChange() {
    const codeSel = document.getElementById('m_poc_state');
    const codeWrap = document.getElementById('m_poc_state_code_other_wrap');
    if (codeSel && codeWrap) codeWrap.style.display = codeSel.value === 'Others' ? '' : 'none';
  }

  function submitModal() {
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

    if (!MEMBERS.length) { alert('Add a team member before scheduling a meeting.'); return; }

    const topicSelect = val('m_topic_select');
    const topic = topicSelect === 'Others' ? val('m_topic_other') : topicSelect;
    if (!topic) {
      alert('Please choose a demo topic.');
      document.getElementById('m_topic_select').focus();
      return;
    }

    if (!val('m_person')) { alert('Please choose who is taking the meeting.'); return; }
    if (!val('m_status')) { alert('Please choose a status.'); return; }
    if (!val('m_date')) { alert('Please choose a date.'); return; }
    if (!val('m_time')) { alert('Please choose a start time.'); return; }
    if (val('m_zone') === '') { alert('Please choose a time zone.'); return; }
    if (!val('m_duration')) { alert('Please choose a duration.'); return; }

    const countrySelect = val('m_country');
    const country = countrySelect === 'Others' ? val('m_country_other') : countrySelect;

    const stateSelect = val('m_poc_state_name');
    const stateName = stateSelect === 'Others' ? val('m_poc_state_other') : stateSelect;

    const codeSelect = val('m_poc_state');
    const stateCode = codeSelect === 'Others' ? val('m_poc_state_code_other') : codeSelect;

    if (!country)   { alert('Please provide a country before saving.'); return; }
    if (!stateName) { alert('Please provide a state before saving.'); return; }
    if (!stateCode) { alert('Please provide a state code before saving.'); return; }

    const fields = {
      poc_name: ['m_poc_name', 'the point-of-contact name'],
      poc_phone: ['m_poc_phone', 'a phone number'],
      poc_email: ['m_poc_email', 'an email address'],
      poc_county_name: ['m_poc_county_name', 'a county / company name'],
    };
    const values = {};
    for (const key in fields) {
      const [id, label] = fields[key];
      const v = val(id);
      if (!v) { alert(`Please provide ${label} before saving.`); return; }
      values[key] = v;
    }

    saveMeeting({
      ...state.activeModal,
      demo_topic: topic,
      person_id: val('m_person'),
      status: val('m_status'),
      date: val('m_date'),
      time: val('m_time') || '10:00',
      zone_index: Number(val('m_zone')),
      duration: Number(val('m_duration')),
      ...values,
      poc_country: country,
      poc_state_name: stateName,
      poc_state: stateCode,
      poc_population_count: val('m_poc_population_count'),
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     GLOBAL LISTENERS
     ══════════════════════════════════════════════════════════════════ */
  // Re-render when crossing a responsive breakpoint (table <-> cards, calendar day count)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const b = currentBucket();
      if (b !== state.bucket || state.view === 'calendar') {
        state.bucket = b;
        render();
      } else {
        fitCalendar();
        fitTableScroll();
      }
    }, 140);
  });

  // Escape closes overlays; click outside closes month dropdown
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.importPreview) { state.importPreview = null; render(); return; }
    if (state.activeModal) { closeModal(); return; }
    if (state.popovers.pocId || state.popovers.momId || state.popovers.actionsId || state.popovers.monthSelectorOpen) {
      closeAllPopovers();
    }
  });

  document.addEventListener('click', e => {
    if (state.popovers.monthSelectorOpen && !e.target.closest('.month-wrap')) {
      state.popovers.monthSelectorOpen = false;
      render();
    }
  }, true);

  // Theme changed on another InfoStride page / tab
  window.addEventListener('storage', e => {
    if (e.key === THEME_KEY && (e.newValue === 'light' || e.newValue === 'dark')) {
      applyTheme(e.newValue);
      render();
    }
  });

  // Boot
  initTheme();
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
  </script>
</body>
</html>
