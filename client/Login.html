<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#090d15" />
<title>InfoStride · Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ══════════════════════════════════════════════════════════════
     DESIGN TOKENS — shared with Master, Meeting Board, US Timer & US Map
     ══════════════════════════════════════════════════════════════ */
  :root {
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --r-xl: 18px;
    --r-lg: 14px;
    --r-md: 10px;
    --r-pill: 999px;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }

  html[data-theme="dark"] {
    --bg:           #090d15;
    --bg-glow-1:    rgba(99, 102, 241, .13);
    --bg-glow-2:    rgba(20, 184, 166, .07);
    --panel:        #131924;
    --panel-2:      #1a2130;
    --panel-3:      #222b3c;
    --panel-glass:  rgba(19, 25, 36, .82);
    --border:       #27303f;
    --border-soft:  #1e2532;
    --border-strong:#33405a;
    --text:         #e9edf6;
    --text-2:       #c3cbdb;
    --muted:        #939cb2;
    --faint:        #626c82;
    --accent:       #818cf8;
    --accent-2:     #6366f1;
    --accent-soft:  rgba(129, 140, 248, .15);
    --accent-line:  rgba(129, 140, 248, .38);
    --shadow-sm:    0 1px 2px rgba(0,0,0,.5);
    --shadow:       0 8px 24px -6px rgba(0,0,0,.6);
    --shadow-lg:    0 24px 60px -12px rgba(0,0,0,.75);
    --scroll-thumb: #2d3748;
    --logo-a:       #e9edf6;
    --logo-b:       #818cf8;
    --err:          #fb7185;
    --err-soft:     rgba(251, 113, 133, .14);
    --err-line:     rgba(251, 113, 133, .35);
    --ok:           #34d399;
    --ok-soft:      rgba(52, 211, 153, .14);
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --bg:           #f1f4fa;
    --bg-glow-1:    rgba(99, 102, 241, .11);
    --bg-glow-2:    rgba(13, 148, 136, .06);
    --panel:        #ffffff;
    --panel-2:      #f5f7fc;
    --panel-3:      #ebeff8;
    --panel-glass:  rgba(255, 255, 255, .84);
    --border:       #dce2ee;
    --border-soft:  #e9edf6;
    --border-strong:#c3ccdf;
    --text:         #111726;
    --text-2:       #33405a;
    --muted:        #5c6579;
    --faint:        #8d97ab;
    --accent:       #4f46e5;
    --accent-2:     #4338ca;
    --accent-soft:  rgba(79, 70, 229, .09);
    --accent-line:  rgba(79, 70, 229, .30);
    --shadow-sm:    0 1px 2px rgba(24, 39, 75, .06);
    --shadow:       0 8px 24px -8px rgba(24, 39, 75, .14);
    --shadow-lg:    0 24px 60px -14px rgba(24, 39, 75, .22);
    --scroll-thumb: #c9d2e3;
    --logo-a:       #1f2430;
    --logo-b:       #4f46e5;
    --err:          #e11d48;
    --err-soft:     rgba(225, 29, 72, .08);
    --err-line:     rgba(225, 29, 72, .28);
    --ok:           #059669;
    --ok-soft:      rgba(5, 150, 105, .10);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 88% -12%, var(--bg-glow-1), transparent 70%),
      radial-gradient(700px 460px at 4% 6%, var(--bg-glow-2), transparent 70%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    font-size: 14px;
    transition: background-color .3s var(--ease), color .3s var(--ease);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 5vw, 48px) 16px;
  }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-soft); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  *::-webkit-scrollbar { width: 10px; }
  *::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 99px;
    border: 2.5px solid transparent; background-clip: content-box;
  }

  /* ══════════════════════════════════════════════════════════════
     AMBIENT BACKDROP
     ══════════════════════════════════════════════════════════════ */
  .ambient {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; overflow: hidden;
  }
  .ambient-dots {
    position: absolute; inset: -10%;
    background-image: radial-gradient(currentColor 1px, transparent 1px);
    background-size: 30px 30px;
    color: var(--text);
    opacity: .045;
    mask-image: radial-gradient(circle at 50% 38%, #000 12%, transparent 68%);
    -webkit-mask-image: radial-gradient(circle at 50% 38%, #000 12%, transparent 68%);
  }
  .ambient-rings {
    position: absolute; left: 50%; top: 34%;
    width: min(880px, 128vw); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    opacity: .5;
  }
  .ambient-rings svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ring-spin   { animation: ringSpin 68s linear infinite; transform-origin: 50% 50%; }
  .ring-spin-r { animation: ringSpin 96s linear infinite reverse; transform-origin: 50% 50%; }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .ambient-glyph {
    position: absolute;
    color: var(--accent);
    opacity: .07;
    animation: glyphDrift 16s ease-in-out infinite;
  }
  .ambient-glyph.g1 { left: 7%;  top: 20%; width: 54px; animation-delay: -2s; }
  .ambient-glyph.g2 { right: 9%; top: 58%; width: 38px; animation-delay: -7s; }
  .ambient-glyph.g3 { left: 14%; bottom: 10%; width: 28px; animation-delay: -11s; }
  @keyframes glyphDrift {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50%     { transform: translateY(-22px) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring-spin, .ring-spin-r, .ambient-glyph { animation: none !important; }
  }
  @media (max-width: 860px) { .ambient-glyph { display: none; } .ambient-dots { opacity: .03; } }

  /* ══════════════════════════════════════════════════════════════
     3-D LOGO STAGE
     ══════════════════════════════════════════════════════════════ */
  .logo-stage {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    margin: 0 auto clamp(4px, 1vw, 10px);
    display: flex; flex-direction: column; align-items: center;
  }
  .logo-glow {
    position: absolute; left: 50%; top: 42%;
    width: min(360px, 78vw); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 62%);
    filter: blur(14px);
    pointer-events: none;
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: .75; transform: translate(-50%,-50%) scale(1); }
    50%     { opacity: 1;   transform: translate(-50%,-50%) scale(1.08); }
  }
  .logo-mount {
    position: relative; z-index: 1;
    width: 100%;
    height: clamp(120px, 17vw, 176px);
    touch-action: none;
  }
  .logo-mount canvas { display: block; width: 100% !important; height: 100% !important; }
  .logo-floor {
    position: relative; z-index: 0;
    width: min(260px, 62vw); height: 26px;
    margin-top: -18px;
    background: radial-gradient(ellipse 50% 42% at center, var(--accent-line) 0%, transparent 72%);
    filter: blur(15px);
    opacity: .38;
    animation: floorPulse 4.6s ease-in-out infinite;
  }
  @keyframes floorPulse {
    0%,100% { transform: scaleX(1);    opacity: .5; }
    50%     { transform: scaleX(1.12); opacity: .68; }
  }
  .wordmark {
    position: relative; z-index: 1;
    height: clamp(22px, 3vw, 30px);
    width: auto; display: block;
    margin-top: clamp(6px, 1.2vw, 12px);
    user-select: none;
  }
  html[data-theme="light"] .wordmark.on-dark  { display: none; }
  html[data-theme="dark"]  .wordmark.on-light { display: none; }

  .logo-css {
    position: absolute; inset: 0; z-index: 1;
    display: none; place-items: center;
    perspective: 900px;
  }
  .logo-css.on { display: grid; }
  .css-scene {
    width: 170px; height: 128px;
    position: relative;
    transform-style: preserve-3d;
    animation: cssSpin 9s linear infinite, cssBob 4.6s ease-in-out infinite;
  }
  .css-chev { position: absolute; inset: 0; transform-style: preserve-3d; }
  .css-layer {
    position: absolute; inset: 0;
    clip-path: polygon(6% 4%, 52% 50%, 6% 96%, 40% 96%, 86% 50%, 40% 4%);
  }
  @keyframes cssSpin { from { transform: rotateY(-26deg); } 50% { transform: rotateY(26deg); } to { transform: rotateY(-26deg); } }
  @keyframes cssBob  { 0%,100% { margin-top: 0; } 50% { margin-top: -14px; } }

  /* ══════════════════════════════════════════════════════════════
     AUTH CARD
     ══════════════════════════════════════════════════════════════ */
  .auth-wrap { position: relative; z-index: 1; width: 100%; max-width: 388px; }
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-lg);
    padding: clamp(22px, 4vw, 30px);
  }
  .auth-title { font-size: 19px; font-weight: 750; letter-spacing: -.3px; }
  .auth-sub   { font-size: 12.5px; color: var(--muted); margin-top: 4px; margin-bottom: 20px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
  .field label { font-size: 11.5px; font-weight: 650; color: var(--text-2); letter-spacing: .01em; }
  .field input {
    height: 40px; padding: 0 12px;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13.5px; font-family: var(--font-ui);
    transition: border-color .18s var(--ease), background .18s var(--ease);
  }
  .field input:focus { outline: none; border-color: var(--accent-line); background: var(--panel); }
  .field input::placeholder { color: var(--faint); }

  .auth-msg {
    font-size: 12.5px; padding: 10px 12px;
    border-radius: var(--r-md);
    margin-bottom: 16px;
    display: none;
    line-height: 1.4;
  }
  .auth-msg.show { display: block; }
  .auth-msg.err { background: var(--err-soft); color: var(--err); border: 1px solid var(--err-line); }
  .auth-msg.ok  { background: var(--ok-soft);  color: var(--ok);  border: 1px solid var(--accent-line); }

  .remember-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-2);
    margin-bottom: 16px; cursor: pointer; user-select: none;
  }
  .remember-row input {
    width: 15px; height: 15px; margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .auth-btn {
    width: 100%; height: 42px;
    border-radius: var(--r-md);
    border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 13.5px; font-weight: 700; font-family: var(--font-ui);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    margin-top: 4px;
  }
  .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -8px var(--accent-line); }
  .auth-btn:active { transform: translateY(0); }
  .auth-btn:disabled { opacity: .6; cursor: default; transform: none; }

  .auth-foot { margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .auth-foot a { color: var(--accent); font-weight: 650; text-decoration: none; }
  .auth-foot a:hover { text-decoration: underline; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .reveal { animation: fadeUp .6s var(--ease) both; }
  .reveal.d1 { animation-delay: .05s; }
  .reveal.d2 { animation-delay: .18s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="ambient-dots"></div>
  <div class="ambient-rings">
    <svg viewBox="0 0 400 400">
      <g fill="none" stroke="var(--accent)" stroke-opacity=".16">
        <circle class="ring-spin"   cx="200" cy="200" r="196" stroke-dasharray="2 12"/>
        <circle class="ring-spin-r" cx="200" cy="200" r="152" stroke-dasharray="1 9" stroke-opacity=".13"/>
        <circle cx="200" cy="200" r="112" stroke-opacity=".09"/>
      </g>
      <g class="ring-spin-r" fill="none" stroke="var(--accent)" stroke-opacity=".10">
        <ellipse cx="200" cy="200" rx="52"  ry="152"/>
        <ellipse cx="200" cy="200" rx="106" ry="152"/>
        <line x1="48" y1="200" x2="352" y2="200"/>
      </g>
    </svg>
  </div>
  <span class="ambient-glyph g1"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 2 L13 12 L3 22 L9 22 L19 12 L9 2 Z"/></svg></span>
  <span class="ambient-glyph g2"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 2 L13 12 L3 22 L9 22 L19 12 L9 2 Z"/></svg></span>
  <span class="ambient-glyph g3"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 2 L13 12 L3 22 L9 22 L19 12 L9 2 Z"/></svg></span>
</div>

<section class="logo-stage reveal d1">
  <div class="logo-glow" aria-hidden="true"></div>
  <div class="logo-mount" id="logoMount" role="img" aria-label="InfoStride animated logo">
    <div class="logo-css" id="logoCss" aria-hidden="true"><div class="css-scene" id="cssScene"></div></div>
  </div>
  <div class="logo-floor" aria-hidden="true"></div>
  <img class="wordmark on-light" src="assets/logo-light.png" alt="InfoStride" width="2560" height="349" />
  <img class="wordmark on-dark" src="assets/logo-dark-cropped.png" alt="InfoStride" width="853" height="120" />
</section>

<div class="auth-wrap reveal d2">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to access the InfoStride workspace.</p>

    <div class="auth-msg" id="authMsg"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="f_email">Email</label>
        <input type="email" id="f_email" autocomplete="username" placeholder="you@infostride.com" required />
      </div>
      <div class="field">
        <label for="f_pass">Password</label>
        <input type="password" id="f_pass" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <label class="remember-row" for="f_remember">
        <input type="checkbox" id="f_remember" />
        Remember me on this device
      </label>
      <button type="submit" class="auth-btn" id="loginBtn">Log In</button>
    </form>

    <p class="auth-foot">Don't have an account? <a href="Signup.html">Create one</a></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════════
     1 · SHARED THEME — read-only here; Master.html owns the toggle.
     ══════════════════════════════════════════════════════════════════ */
  var THEME_KEY = 'infostride-theme';
  function safeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }

  function applyThemeAttr(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f1f4fa' : '#090d15');
    if (window.__logoTheme) window.__logoTheme();
  }

  function readTheme() {
    var t = safeGet(THEME_KEY);
    if (t === 'light' || t === 'dark') return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }

  applyThemeAttr(readTheme());

  window.addEventListener('storage', function (e) {
    if (e.key === THEME_KEY && e.newValue) applyThemeAttr(e.newValue);
  });

  /* ══════════════════════════════════════════════════════════════════
     2 · SIGN IN
     Checks the account list the Signup page writes to localStorage.
     NOTE: this is a client-side demo gate, not real security — anyone
     with devtools access to this browser profile can read or edit
     localStorage. Don't rely on it to protect sensitive data.
     ══════════════════════════════════════════════════════════════════ */
  var USERS_KEY    = 'infostride-users';
  var SESSION_KEY  = 'infostride-user';
  var REMEMBER_KEY = 'infostride-remember';

  function loadUsers() {
    try { var r = window.localStorage.getItem(USERS_KEY); return r ? JSON.parse(r) : []; }
    catch (e) { return []; }
  }

  function hash(str) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      var data = new TextEncoder().encode(str);
      return window.crypto.subtle.digest('SHA-256', data).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
      });
    }
    // Fallback for contexts without SubtleCrypto — NOT cryptographically secure.
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
    return Promise.resolve('fh_' + Math.abs(h).toString(16));
  }

  // Already signed in this tab? Skip straight to the workspace.
  try {
    if (window.sessionStorage.getItem(SESSION_KEY)) { window.location.replace('Master.html'); }
  } catch (e) {}

  // "Remember me" from a previous visit — restore the session without
  // asking for credentials again, then skip straight to the workspace.
  try {
    var remembered = window.localStorage.getItem(REMEMBER_KEY);
    if (remembered) {
      window.sessionStorage.setItem(SESSION_KEY, remembered);
      window.location.replace('Master.html');
    }
  } catch (e) {}

  var form    = document.getElementById('loginForm');
  var msg     = document.getElementById('authMsg');
  var loginBtn = document.getElementById('loginBtn');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'auth-msg show ' + type;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('f_email').value.trim().toLowerCase();
    var pass  = document.getElementById('f_pass').value;
    if (!email || !pass) { showMsg('Enter your email and password.', 'err'); return; }

    var user = loadUsers().filter(function (u) { return u && u.email === email; })[0];
    if (!user) { showMsg('No account found for that email.', 'err'); return; }

    loginBtn.disabled = true;
    hash(pass).then(function (h) {
      loginBtn.disabled = false;
      if (h !== user.passwordHash) { showMsg('Incorrect password.', 'err'); return; }
      if (user.status === 'pending') { showMsg('Your account is still awaiting admin approval.', 'err'); return; }
      if (user.status === 'declined') { showMsg('Your account request was declined. Contact an admin.', 'err'); return; }

      var sessionPayload = JSON.stringify({
        name: user.name, email: user.email, role: user.role
      });
      try {
        window.sessionStorage.setItem(SESSION_KEY, sessionPayload);
        var remember = document.getElementById('f_remember').checked;
        if (remember) {
          window.localStorage.setItem(REMEMBER_KEY, sessionPayload);
        } else {
          window.localStorage.removeItem(REMEMBER_KEY);
        }
      } catch (err) {}

      showMsg('Signed in — redirecting…', 'ok');
      setTimeout(function () { window.location.href = 'Master.html'; }, 400);
    });
  });

  /* ══════════════════════════════════════════════════════════════════
     3 · THE 3-D LOGO — identical treatment to Master.html
     ══════════════════════════════════════════════════════════════════ */
  var mount = document.getElementById('logoMount');

  function cssFallback() {
    var scene = document.getElementById('cssScene');
    var wrap = document.getElementById('logoCss');
    var LAYERS = 14;
    var html = '';
    for (var c = 0; c < 2; c++) {
      html += '<div class="css-chev" style="transform:translateX(' + (c * 44 - 22) + 'px) translateZ(0)">';
      for (var i = 0; i < LAYERS; i++) {
        var t = i / (LAYERS - 1);
        html += '<div class="css-layer" style="'
              + 'background:' + (c === 0 ? 'var(--logo-a)' : 'var(--logo-b)') + ';'
              + 'filter:brightness(' + (0.55 + 0.45 * t).toFixed(3) + ');'
              + 'transform:translateZ(' + ((i - LAYERS / 2) * 2.4).toFixed(2) + 'px);'
              + '"></div>';
      }
      html += '</div>';
    }
    scene.innerHTML = html;
    wrap.classList.add('on');
  }

  if (typeof THREE === 'undefined') { cssFallback(); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { cssFallback(); return; }
  if (!renderer || !renderer.getContext()) { cssFallback(); return; }

  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  mount.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, mount.clientWidth / mount.clientHeight, 0.1, 100);
  camera.position.set(0, 0.35, 9.2);
  camera.lookAt(0, 0, 0);

  function chevronShape(halfH, tipX, backX, thickness) {
    var s = new THREE.Shape();
    s.moveTo(backX, halfH);
    s.lineTo(tipX, 0);
    s.lineTo(backX, -halfH);
    s.lineTo(backX - thickness, -halfH);
    s.lineTo(tipX - thickness, 0);
    s.lineTo(backX - thickness, halfH);
    s.closePath();
    return s;
  }

  var GEO = new THREE.ExtrudeGeometry(
    chevronShape(1.15, 0.62, -0.52, 0.62),
    { depth: 0.46, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3, curveSegments: 1 }
  );
  GEO.center();

  function themeColours() {
    var cs = getComputedStyle(document.documentElement);
    return [cs.getPropertyValue('--logo-a').trim() || '#e9edf6',
            cs.getPropertyValue('--logo-b').trim() || '#818cf8'];
  }

  var group = new THREE.Group();
  var mats = [];
  var COLS = themeColours();
  for (var i = 0; i < 2; i++) {
    var mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COLS[i]).convertSRGBToLinear(),
      metalness: 0.42, roughness: 0.26
    });
    mats.push(mat);
    var mesh = new THREE.Mesh(GEO, mat);
    mesh.position.x = i * 1.34 - 0.67;
    mesh.position.z = i * 0.06;
    group.add(mesh);
  }
  group.rotation.set(-0.06, -0.5, 0);
  scene.add(group);

  window.__logoTheme = function () {
    var c = themeColours();
    for (var i = 0; i < mats.length; i++) {
      mats[i].color.set(new THREE.Color(c[i]).convertSRGBToLinear());
    }
    setLights();
  };

  var key  = new THREE.DirectionalLight(0xffffff, 0.85);
  var fill = new THREE.DirectionalLight(0xc7d2fe, 0.42);
  var rim  = new THREE.DirectionalLight(0x818cf8, 0.75);
  var amb  = new THREE.HemisphereLight(0xffffff, 0x1a2130, 0.55);
  key.position.set(4.5, 6, 7);
  fill.position.set(-6, -1.5, 4);
  rim.position.set(-3, 3.5, -6);
  scene.add(key, fill, rim, amb);

  function setLights() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    amb.groundColor.set(light ? 0xdfe4f0 : 0x1a2130);
    amb.intensity = light ? 0.72 : 0.55;
    key.intensity = light ? 0.78 : 0.85;
    rim.intensity = light ? 0.42 : 0.75;
    rim.color.set(light ? 0x6366f1 : 0x818cf8);
  }
  setLights();

  var px = 0, py = 0, tx = 0, ty = 0;
  mount.addEventListener('pointermove', function (e) {
    var r = mount.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });
  mount.addEventListener('pointerleave', function () { tx = 0; ty = 0; });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = null;

  function frame(ts) {
    if (t0 === null) t0 = ts;
    var t = (ts - t0) / 1000;

    px += (tx - px) * 0.06;
    py += (ty - py) * 0.06;

    if (reduce) {
      group.rotation.y = -0.5 + px * 0.3;
      group.rotation.x = -0.06 + py * 0.18;
    } else {
      group.rotation.y = -0.42 + Math.sin(t * 0.5) * 0.52 + px * 0.34;
      group.rotation.x = -0.05 + Math.sin(t * 0.72) * 0.1 + py * 0.2;
      group.rotation.z = Math.sin(t * 0.33) * 0.045;
      group.position.y = Math.sin(t * 1.05) * 0.11;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function resize() {
    var w = mount.clientWidth, h = mount.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
