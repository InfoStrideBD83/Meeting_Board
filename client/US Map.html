<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InfoStride · US Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Design tokens — matched to the InfoStride Meeting Board ────────── */
  :root {
    --bg: #f1f4fa;
    --bg-glow-1: rgba(99, 102, 241, .11);
    --bg-glow-2: rgba(13, 148, 136, .06);

    --panel: rgba(255, 255, 255, 0.90);
    --panel-solid: #ffffff;
    --panel-2: #f5f7fc;

    --ink: #111726;
    --ink-2: #33405a;
    --ink-dim: #5c6579;

    --line: #dce2ee;
    --line-soft: rgba(17, 23, 38, .10);
    --line-strong: #c3ccdf;

    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, .09);
    --accent-line: rgba(79, 70, 229, .30);

    --shadow: 0 8px 24px -8px rgba(24, 39, 75, .14);
    --shadow-lg: 0 24px 60px -14px rgba(24, 39, 75, .22);

    --radius: 14px;
    --radius-sm: 10px;

    --serif: "Palatino Linotype", Palatino, "Iowan Old Style", "Book Antiqua", Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }

  body.dark {
    --bg: #090d15;
    --bg-glow-1: rgba(99, 102, 241, .13);
    --bg-glow-2: rgba(20, 184, 166, .07);

    --panel: rgba(19, 25, 36, 0.88);
    --panel-solid: #131924;
    --panel-2: #1a2130;

    --ink: #e9edf6;
    --ink-2: #c3cbdb;
    --ink-dim: #939cb2;

    --line: #27303f;
    --line-soft: rgba(255, 255, 255, .10);
    --line-strong: #33405a;

    --accent: #818cf8;
    --accent-soft: rgba(129, 140, 248, .15);
    --accent-line: rgba(129, 140, 248, .38);

    --shadow: 0 8px 24px -6px rgba(0, 0, 0, .6);
    --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .75);
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 88% -12%, var(--bg-glow-1), transparent 70%),
      radial-gradient(700px 460px at 4% 4%, var(--bg-glow-2), transparent 70%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  #stage { position: fixed; inset: 0; top: 62px; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage.hovering { cursor: pointer; }

  .toolbar { position: fixed; top: 18px; right: 18px; z-index: 10; display: flex; gap: 8px; }
  .btn {
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--sans); font-size: 12px; font-weight: 650; letter-spacing: 0.01em;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    min-height: 34px; padding: 7px 13px; cursor: pointer;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .btn:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .btn-icon { padding: 7px; width: 34px; }
  body:not(.dark) .ic-moon { display: none; }
  body.dark .ic-sun { display: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ════════════════════════════════════════════════════════════════
     HEADER WITH ANIMATIONS (matching Master.html style)
     ════════════════════════════════════════════════════════════════ */
  .app-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--panel);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line);
    isolation: isolate;
  }

  .header-fx {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .fx-aurora, .fx-beam, .fx-line, .fx-grid { position: absolute; display: block; }

  .fx-aurora {
    top: -420%; left: -30%; width: 160%; height: 900%;
    background: conic-gradient(from 0deg,
      transparent 0deg, var(--accent-soft) 42deg, transparent 96deg,
      rgba(20, 184, 166, .07) 168deg, transparent 222deg,
      var(--accent-soft) 300deg, transparent 360deg);
    animation: fxAurora 34s linear infinite;
    filter: blur(30px);
    opacity: .8;
  }
  @keyframes fxAurora { to { transform: rotate(360deg); } }

  .fx-grid {
    inset: 0;
    background-image: linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 46px 100%;
    opacity: .5;
    animation: fxGrid 12s linear infinite;
  }
  @keyframes fxGrid { to { background-position: 46px 0; } }

  .fx-beam {
    top: 0; bottom: 0; left: 0; width: 24%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.11) 48%, transparent);
    filter: blur(3px);
    transform: translateX(-160%);
    animation: fxBeam 8.5s ease infinite;
  }
  @keyframes fxBeam {
    0%        { transform: translateX(-160%); }
    58%, 100% { transform: translateX(520%); }
  }

  .fx-line {
    left: 0; bottom: 0; width: 34%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 8px var(--accent-line);
    animation: fxLine 7s linear infinite;
  }
  @keyframes fxLine {
    0%   { transform: translateX(-100%); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateX(320%); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fx-aurora, .fx-beam, .fx-line, .fx-grid { animation: none !important; }
    .fx-beam { opacity: 0; }
  }

  .header-inner {
    position: relative; z-index: 1;
    max-width: 1760px; margin: 0 auto;
    min-height: 62px;
    padding: 10px clamp(12px, 2.2vw, 28px);
    display: flex; align-items: center; gap: 14px;
  }

  .header-spacer { flex: 1; }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  .brand-logo {
    height: 27px; width: auto; display: block; flex-shrink: 0;
    -webkit-user-select: none; user-select: none;
  }
  .brand-logo.on-dark { display: none; }
  body.dark .brand-logo.on-light { display: none; }
  body.dark .brand-logo.on-dark { display: block; }

  /* ---- detail card ---- */
  #card {
    position: fixed; right: 18px; top: 66px; z-index: 15; width: 252px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    padding: 15px 17px 13px;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    box-shadow: var(--shadow-lg);
  }
  #card.on { opacity: 1; transform: translateY(0); }
  #card { transition: opacity 0.15s ease, transform 0.15s ease, background 0.35s ease, border-color 0.35s ease; }
  #card.pinned { pointer-events: auto; }
  #card .zone {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 5px;
  }
  #card h2 {
    font-family: var(--serif); font-weight: 400; font-size: 25px;
    font-variant: small-caps; letter-spacing: 0.07em; line-height: 1.1;
    margin-bottom: 10px;
  }
  #card .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line-soft);
  }
  #card .row .k { font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
  #card .row .v { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink); text-align: right; }
  #card .close {
    position: absolute; top: 5px; right: 7px; border: 0; background: none;
    color: var(--ink-dim); font-size: 16px; line-height: 1; cursor: pointer; padding: 4px;
    display: none;
  }
  #card.pinned .close { display: block; }
  #card .close:hover { color: var(--accent); background: var(--accent-soft); border-radius: 6px; }
  #card .close:focus-visible { outline: 2px solid var(--accent); }

  /* ---- legend ---- */
  #legend {
    position: fixed; left: 18px; bottom: 18px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 11px 14px 10px; max-width: 340px;
  }
  #legend .chips { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  #legend .chip { display: flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
  #legend .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line-soft); flex: none; }
  #legend .note { margin-top: 7px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; color: var(--ink-dim); line-height: 1.5; }

  /* ---- compass ---- */
  #compass { position: fixed; right: 20px; bottom: 20px; z-index: 10; width: 52px; height: 52px; pointer-events: none; }
  #compass .c-ring { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  #compass .c-s { fill: var(--line-strong); }
  #compass .c-n, #compass .c-t { fill: var(--accent); }
  #compass .c-s { fill: var(--line); }
  #legend { transition: background 0.35s ease, border-color 0.35s ease; }

  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 50;
    text-align: center; padding: 30px; font-size: 14px; color: var(--ink-dim);
  }

  @media (max-width: 640px) {
    .header-inner { padding: 10px 14px; }
    #card { right: 12px; top: 72px; width: min(252px, calc(100vw - 24px)); }
    #legend { left: 12px; right: 78px; bottom: 14px; max-width: none; padding: 8px 11px 7px; }
    #legend .chips { gap: 4px 11px; }
    #compass { right: 16px; bottom: 16px; width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-fx" aria-hidden="true">
    <span class="fx-aurora"></span>
    <span class="fx-grid"></span>
    <span class="fx-beam"></span>
    <span class="fx-line"></span>
  </div>
  <div class="header-inner">
    <a class="btn btn-icon" href="Master.html" title="Home" aria-label="Go to Home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    </a>
    <img class="brand-logo on-light" src="assets/logo-light.png" alt="InfoStride" width="2560" height="349" />
    <img class="brand-logo on-dark" src="assets/logo-dark-cropped.png" alt="InfoStride" width="853" height="120" />
    <div class="header-spacer"></div>
    <div class="header-actions">
      <button class="btn" id="resetBtn" title="Reset the view (R)">Recenter</button>
    </div>
  </div>
</header>

<div id="stage"></div>

<aside id="card" aria-live="polite">
  <button class="close" id="cardClose" aria-label="Unpin details">&times;</button>
  <div class="zone" id="cardZone"></div>
  <h2 id="cardName"></h2>
  <div class="row"><span class="k">Local time</span><span class="v" id="cardTime"></span></div>
  <div class="row"><span class="k">Capital</span><span class="v" id="cardCap"></span></div>
  <div class="row"><span class="k">Population</span><span class="v" id="cardPop"></span></div>
  <div class="row"><span class="k" id="cardCntyK">Counties</span><span class="v" id="cardCnty"></span></div>
  <div class="row"><span class="k">State agencies</span><span class="v" id="cardAg"></span></div>
</aside>

<div id="legend">
  <div class="chips" id="legendChips"></div>
  <div class="note">Hover a state · click to pin · &#8776; marks estimated agency counts</div>
</div>

<svg id="compass" viewBox="0 0 60 60" aria-hidden="true">
  <circle class="c-ring" cx="30" cy="30" r="27"/>
  <g id="needle">
    <path class="c-n" d="M30 8 L34.5 30 L30 26 L25.5 30 Z"/>
    <path class="c-s" d="M30 52 L34.5 30 L30 34 L25.5 30 Z"/>
    <text class="c-t" x="30" y="6.5" text-anchor="middle" font-size="8" font-family="Georgia, serif">N</text>
  </g>
</svg>

<div id="fallback">The 3D engine could not be loaded.<br>Check your connection and reload the page.</div>

    PST:  { label: 'Pacific Time',  top: '#b07ce8', ids: ['CA','NV','OR','WA'] },
    AKST: { label: 'Alaska Time',   top: '#4bb8d4', ids: ['AK'] },
    HST:  { label: 'Hawaii\u2013Aleutian', top: '#ef8fa5', ids: ['HI'] }
  };
  var ZONE_OF = {};
  Object.keys(ZONES).forEach(function (z) {
    ZONES[z].ids.forEach(function (id) { ZONE_OF[id] = z; });
  });

  // build the legend
  (function () {
    var wrap = document.getElementById('legendChips');
    Object.keys(ZONES).forEach(function (z) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      var sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = ZONES[z].top;
      chip.appendChild(sw);
      chip.appendChild(document.createTextNode(ZONES[z].label));
      wrap.appendChild(chip);
    });
  })();

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= scene ================= */
  var stage = document.getElementById('stage');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    var fb = document.getElementById('fallback');
    fb.textContent = 'Your browser could not create a WebGL context, so the 3D map can’t render. Try enabling hardware acceleration in your browser’s settings, updating your graphics driver, or opening this page in a different browser.';
    fb.style.display = 'grid';
    return;
  }
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = false;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 1200);
  var TARGET = new THREE.Vector3(0, 0, 2);

  var hemi = new THREE.HemisphereLight(0xffffff, 0xdfe4f0, 0.72);
  scene.add(hemi);
  var key = new THREE.DirectionalLight(0xfffefb, 0.46);
  key.position.set(60, 95, 45);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xc7d2fe, 0.20);
  fill.position.set(-55, 40, -65);
  scene.add(fill);

  /* ================= build states ================= */
  var DEPTH = 1.7;
  var mapGroup = new THREE.Group();
  mapGroup.rotation.x = -Math.PI / 2;
  scene.add(mapGroup);

  var pickMeshes = [];
  var stateGroups = {};

  function makeLabel(text, worldW) {
    var scl = 2;
    var font = '600 ' + (44 * scl) + 'px Georgia, "Times New Roman", serif';
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    ctx.font = font;
    var tw = ctx.measureText(text).width;
    cv.width = Math.ceil(tw + 28 * scl);
    cv.height = Math.ceil(64 * scl);
    ctx = cv.getContext('2d');
    ctx.font = font;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.93)';
    ctx.lineWidth = 7 * scl;
    ctx.strokeText(text, cv.width / 2, cv.height / 2);
    ctx.fillStyle = '#111726';
    ctx.fillText(text, cv.width / 2, cv.height / 2);

    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    var worldH = worldW * (cv.height / cv.width);
    if (worldH > 2.3) { worldW *= 2.3 / worldH; worldH = 2.3; }
    sp.scale.set(worldW, worldH, 1);
    return sp;
  }

  MAP.s.forEach(function (st) {
    var zone = ZONES[ZONE_OF[st.i]];
    var top = new THREE.Color(zone.top).convertSRGBToLinear();
    var side = top.clone().offsetHSL(0, 0.03, -0.16);

    var topMat = new THREE.MeshStandardMaterial({
      color: top, roughness: 0.85, metalness: 0.03,
      emissive: new THREE.Color(0xffffff), emissiveIntensity: 0
    });
    var sideMat = new THREE.MeshStandardMaterial({
      color: side, roughness: 0.92, metalness: 0.02,
      emissive: new THREE.Color(0xffffff), emissiveIntensity: 0
    });

    var g = new THREE.Group();
    g.userData = { id: st.i, name: st.n, lift: 0, topMat: topMat, sideMat: sideMat };

    st.r.forEach(function (flat) {
      var shape = new THREE.Shape();
      shape.moveTo(flat[0], flat[1]);
      for (var i = 2; i < flat.length; i += 2) shape.lineTo(flat[i], flat[i + 1]);
      shape.closePath();

      var geo = new THREE.ExtrudeGeometry(shape, { depth: DEPTH, bevelEnabled: false, steps: 1, curveSegments: 1 });
      var mesh = new THREE.Mesh(geo, [topMat, sideMat]);
      mesh.userData.stateId = st.i;
      g.add(mesh);
      pickMeshes.push(mesh);

      var pts = [];
      for (var j = 0; j < flat.length; j += 2) pts.push(new THREE.Vector3(flat[j], flat[j + 1], DEPTH + 0.03));
      var line = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x3b4762, transparent: true, opacity: 0.45 })
      );
      g.add(line);
    });

    // name label — full name when it fits, abbreviation for small states
    var labelW = Math.min(Math.max(st.bw * 0.62, 2.2), 9.5);
    var text = st.n;
    if (labelW / text.length < 0.52) {
      text = st.i;
      labelW = Math.min(Math.max(st.bw * 0.9, 1.5), 3.2);
    }
    var sprite = makeLabel(text, labelW);
    sprite.position.set(st.c[0], st.c[1], DEPTH + 0.6);
    g.add(sprite);

    stateGroups[st.i] = g;
    mapGroup.add(g);
  });

  /* ================= camera orbit ================= */
  var az = 0, pol = 0.88;
  var azVel = 0, polVel = 0;
  var radius = (window.innerWidth / window.innerHeight < 1) ? 175 : 122;
  var radiusTarget = radius;
  var POL_MIN = 0.28, POL_MAX = 1.32, R_MIN = 62, R_MAX = 260;

  function applyCamera() {
    var st = Math.sin(pol), ct = Math.cos(pol);
    camera.position.set(
      TARGET.x + radius * st * Math.sin(az),
      TARGET.y + radius * ct,
      TARGET.z + radius * st * Math.cos(az)
    );
    camera.lookAt(TARGET);
    document.getElementById('needle').setAttribute('transform', 'rotate(' + (az * 180 / Math.PI) + ' 30 30)');
  }

  /* ================= interaction ================= */
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2(-2, -2);
  var hovered = null, selected = null;
  var idleAt = performance.now();

  var pointers = new Map();
  var pinchDist = 0;
  var downInfo = null;

  function markActive() { idleAt = performance.now(); }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  stage.addEventListener('pointerdown', function (e) {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      downInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
      stage.classList.add('dragging');
    } else if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      downInfo = null;
    }
    markActive();
  });

  stage.addEventListener('pointermove', function (e) {
    ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;

    if (pointers.has(e.pointerId)) {
      var prev = pointers.get(e.pointerId);
      var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        azVel -= dx * 0.0045;
        polVel -= dy * 0.0038;
      } else if (pointers.size === 2) {
        var p = Array.from(pointers.values());
        var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        if (pinchDist > 0) radiusTarget = clamp(radiusTarget * (pinchDist / d), R_MIN, R_MAX);
        pinchDist = d;
      }
      markActive();
    }
  });

  function endPointer(e) {
    if (pointers.size <= 1) stage.classList.remove('dragging');
    var wasTap = downInfo && pointers.size === 1 &&
      Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y) < 7 &&
      (performance.now() - downInfo.t) < 350;
    pointers.delete(e.pointerId);
    pinchDist = 0;
    if (wasTap) handleTap(e.clientX, e.clientY);
    if (e.pointerType !== 'mouse') { ndc.x = -2; ndc.y = -2; }
    downInfo = null;
    markActive();
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    radiusTarget = clamp(radiusTarget * (1 + e.deltaY * 0.0011), R_MIN, R_MAX);
    markActive();
  }, { passive: false });

  function handleTap(px, py) {
    ndc.x = (px / window.innerWidth) * 2 - 1;
    ndc.y = -(py / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickMeshes);
    select(hits.length ? hits[0].object.userData.stateId : null);
  }

  /* ================= detail card ================= */
  var card = document.getElementById('card');
  var shown = null;

  // zone -> IANA time zone, so the clock follows DST automatically
  var ZONE_TZ = {
    EST:  'America/New_York',    CST: 'America/Chicago',
    MST:  'America/Denver',      PST: 'America/Los_Angeles',
    AKST: 'America/Anchorage',   HST: 'Pacific/Honolulu'
  };
  var TZ_OVERRIDE = { AZ: 'America/Phoenix' }; // Arizona stays on MST year-round
  var timeFmts = {};

  function tzOf(id) { return TZ_OVERRIDE[id] || ZONE_TZ[ZONE_OF[id]]; }

  function fmtTime(tz) {
    if (!timeFmts[tz]) {
      try {
        timeFmts[tz] = new Intl.DateTimeFormat('en-US', {
          hour: 'numeric', minute: '2-digit', second: '2-digit',
          hour12: true, timeZone: tz
        });
      } catch (e) { return '\u2014'; }
    }
    return timeFmts[tz].format(new Date());
  }

  var cardTimeEl = document.getElementById('cardTime');
  function updateCardTime() { if (shown) cardTimeEl.textContent = fmtTime(tzOf(shown)); }
  setInterval(updateCardTime, 1000);

  function fmtPop(m) { return m < 1 ? Math.round(m * 1000) + 'K' : m.toFixed(1) + 'M'; }
  function countyKey(id) { return id === 'LA' ? 'Parishes' : id === 'AK' ? 'Boroughs + CAs' : 'Counties'; }

  function renderCard(id) {
    if (!id) { card.classList.remove('on'); shown = null; return; }
    if (shown !== id) {
      shown = id;
      var z = ZONES[ZONE_OF[id]];
      var f = FACTS[id];
      var zoneEl = document.getElementById('cardZone');
      zoneEl.textContent = id + ' \u00B7 ' + z.label;
      zoneEl.style.color = new THREE.Color(z.top).offsetHSL(0, 0.05, dark ? 0.1 : -0.18).getStyle();
      document.getElementById('cardName').textContent = stateGroups[id].userData.name;
      document.getElementById('cardCap').textContent = f[0];
      document.getElementById('cardPop').textContent = fmtPop(f[1]) + ' (est.)';
      document.getElementById('cardCntyK').textContent = countyKey(id);
      document.getElementById('cardCnty').textContent = COUNTIES[id];
      document.getElementById('cardAg').textContent = (id in AGENCIES)
        ? ((id in VERIFIED_AGENCIES) ? '' : '\u2248 ') + AGENCIES[id]
        : '\u2014';
      updateCardTime();
    }
    card.classList.add('on');
  }

  function select(id) {
    selected = id;
    card.classList.toggle('pinned', !!id);
    renderCard(id || hovered);
  }
  document.getElementById('cardClose').addEventListener('click', function () { select(null); });

  function resetView() {
    select(null);
    az = 0; pol = 0.88; azVel = 0; polVel = 0;
    radiusTarget = (window.innerWidth / window.innerHeight < 1) ? 175 : 122;
    markActive();
  }
  document.getElementById('resetBtn').addEventListener('click', resetView);

  /* ================= theme ================= */
  /* Shares one localStorage key with the rest of the InfoStride pages, so a
     choice made on the Workspace / Board / Timer carries over to here. */
  var THEME_KEY = 'infostride-theme';
  function safeGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k,v){ try { window.localStorage.setItem(k,v); } catch (e) {} }

  var stored = safeGet(THEME_KEY);
  var dark = (stored === 'light' || stored === 'dark')
    ? (stored === 'dark')
    : window.matchMedia('(prefers-color-scheme: dark)').matches;

  function applyTheme() {
    document.body.classList.toggle('dark', dark);
    if (dark) {
      hemi.color.set(0xe6ebf7); hemi.groundColor.set(0x1a2130); hemi.intensity = 0.66;
      key.intensity = 0.42; fill.intensity = 0.26;
    } else {
      hemi.color.set(0xffffff); hemi.groundColor.set(0xdfe4f0); hemi.intensity = 0.72;
      key.intensity = 0.46; fill.intensity = 0.20;
    }
    if (shown) { var s = shown; shown = null; renderCard(s); }
  }

  function syncThemeFromParent() {
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        var parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
        if (parentTheme === 'dark' || parentTheme === 'light') dark = (parentTheme === 'dark');
      }
    } catch (e) {
      /* cross-origin parent — keep the stored/OS preference */
    }
    applyTheme();
  }

  /* Theme changed on another InfoStride page / tab */
  window.addEventListener('storage', function (e) {
    if (e.key === THEME_KEY && (e.newValue === 'light' || e.newValue === 'dark')) {
      dark = (e.newValue === 'dark');
      applyTheme();
    }
  });

  // Initial sync
  syncThemeFromParent();

  // Listen for changes sent from parent
  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'THEME_CHANGE') {
      dark = (event.data.theme === 'dark');
      applyTheme();
    }
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') select(null);
    if (e.key === 'r' || e.key === 'R') resetView();
    if (e.key === 'ArrowLeft') { azVel += 0.02; markActive(); }
    if (e.key === 'ArrowRight') { azVel -= 0.02; markActive(); }
    if (e.key === 'ArrowUp') { polVel -= 0.015; markActive(); }
    if (e.key === 'ArrowDown') { polVel += 0.015; markActive(); }
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ================= frame loop ================= */
  var LERP = REDUCED ? 1 : 0.14;

  function frame() {
    requestAnimationFrame(frame);

    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickMeshes);
    var hitId = hits.length ? hits[0].object.userData.stateId : null;
    if (hitId !== hovered) {
      hovered = hitId;
      stage.classList.toggle('hovering', !!hovered);
      if (!selected) renderCard(hovered);
    }

    if (!REDUCED && !selected && !hovered && pointers.size === 0 &&
        performance.now() - idleAt > 6000) {
      azVel += (0.0016 - azVel) * 0.02;
    }

    az += azVel; pol = clamp(pol + polVel, POL_MIN, POL_MAX);
    azVel *= 0.90; polVel *= 0.90;
    radius += (radiusTarget - radius) * 0.16;
    applyCamera();

    for (var id in stateGroups) {
      var g = stateGroups[id];
      var targetLift = (id === selected) ? 1.5 : (id === hovered) ? 0.95 : 0;
      var targetGlow = (id === selected) ? 0.13 : (id === hovered) ? 0.2 : 0;
      g.userData.lift += (targetLift - g.userData.lift) * LERP;
      g.position.z = g.userData.lift;
      var m = g.userData.topMat;
      m.emissiveIntensity += (targetGlow - m.emissiveIntensity) * LERP;
      g.userData.sideMat.emissiveIntensity = m.emissiveIntensity * 0.6;
    }

    renderer.render(scene, camera);
  }

  applyTheme();
  applyCamera();
  frame();
})();
</script>
</body>
</html>
