# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# After the first deploy, set the secret env vars below in the Render
# dashboard (Environment tab) — they're marked sync:false so Render prompts
# for them instead of expecting them in this file.
services:
  - type: web
    name: infostride-meeting-board-api
    runtime: node
    rootDir: server
    plan: free
    # Builds the server's own deps, then builds the React client (client/dist)
    # that server/src/index.js serves — Render's rootDir only covers server/,
    # so the client build has to be triggered explicitly here too.
    # --include=dev on both: NODE_ENV=production (set below) makes a plain
    # `npm install` skip devDependencies entirely, which would silently drop
    # vite itself — the thing `npm run build` needs to run at all.
    buildCommand: npm install --include=dev && cd ../client && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Web Push (background notifications for messages/calls — see
      # server/src/utils/push.js). The public key is, by design, not a
      # secret — it's shipped to every browser already — so it's fine
      # committed here; VITE_VAPID_PUBLIC_KEY is the same value, just also
      # under the prefix Vite bakes into the client bundle at build time.
      # The private key signs push payloads, so it stays out of the repo.
      - key: VAPID_PUBLIC_KEY
        value: BO5IplMITOcmBreGzTPP7EBTJ_CBHRavdGAUVsbIbrv_ntysP0V-6--a9Y-ZeNA-VbVGZPgEZuqDJvrI9LtyqQA
      - key: VITE_VAPID_PUBLIC_KEY
        value: BO5IplMITOcmBreGzTPP7EBTJ_CBHRavdGAUVsbIbrv_ntysP0V-6--a9Y-ZeNA-VbVGZPgEZuqDJvrI9LtyqQA
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        value: mailto:admin@example.com
